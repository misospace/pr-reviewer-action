---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Weekly (plus manual dispatch) run of scripts/harvest_human_findings.py
# (#798): mines maintainer CHANGES_REQUESTED reviews / blocking PR comments,
# at heads the reviewer bot approved, into evals/corpus-human-findings.json.
#
# Repos/maintainers/bots are configured via repo variables or dispatch
# inputs — never hardcoded here, so this stays repository-agnostic per
# AGENTS.md. The script only ever reads GitHub; this workflow's only write
# is a branch + PR opened for human curation. It never pushes to main.

name: Harvest Human Findings

on:
  workflow_dispatch:
    inputs:
      repos:
        description: "Comma-separated owner/repo list (default: vars.HARVEST_REPOS)"
        required: false
        default: ""
        type: string
      maintainers:
        description: "Comma-separated maintainer logins (default: vars.HARVEST_MAINTAINERS)"
        required: false
        default: ""
        type: string
      bots:
        description: "Comma-separated reviewer-bot logins (default: vars.HARVEST_BOTS)"
        required: false
        default: ""
        type: string
      since:
        description: "YYYY-MM-DD lower bound on PR updated_at (blank = no bound)"
        required: false
        default: ""
        type: string
  schedule:
    # Weekly Monday 07:00 UTC, offset from the eval-harness 06:00 sweep.
    - cron: "0 7 * * 1"

permissions: {}

jobs:
  resolve-scope:
    name: Resolve app-token scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      owner: ${{ steps.scope.outputs.owner }}
      repos: ${{ steps.scope.outputs.repos }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actions/create-github-app-token scopes an installation token to a
      # single owner. Derive that owner (and the repo-name list under it,
      # including this repo so the PR-opening step below keeps working)
      # from the configured harvest scope, instead of leaving the token
      # unscoped (installation-wide) as before. Repos spanning more than
      # one owner aren't supported by a single token -- fail clearly rather
      # than silently widening or narrowing the scope. Logic lives in
      # scripts/resolve_harvest_scope.sh so it's covered by an executable
      # test (tests/test_resolve_harvest_scope.sh).
      - name: Compute owner/repos for the app token
        id: scope
        env:
          REPOS: ${{ inputs.repos || vars.HARVEST_REPOS }}
          CURRENT_REPO: ${{ github.repository }}
        run: scripts/resolve_harvest_scope.sh

  harvest:
    name: Harvest human findings
    needs: resolve-scope
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.MISO_APP_ID }}
          private-key: ${{ secrets.MISO_APP_PRIVATE_KEY }}
          owner: ${{ needs.resolve-scope.outputs.owner }}
          repositories: ${{ needs.resolve-scope.outputs.repos }}

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      # A prior run's harvest may still be sitting in an unmerged bot-branch
      # PR. push_harvest_branch.sh resets that branch to main's tip and
      # commits this run's output on top, so anything only on the unmerged
      # PR would otherwise be silently dropped. Carry it forward into this
      # run's input corpus (before the harvest script appends anything new)
      # so the duplicate-id check sees it and the next push carries both.
      #
      # This step's bot_branch_sha output is the exact remote SHA the merge
      # was based on (or empty, if absent) and is threaded through to the
      # push step's lease unmodified -- see push_harvest_branch.sh for why
      # re-fetching there instead would race a concurrent run.
      - name: Merge unmerged bot-branch corpus entries
        id: merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >
          scripts/merge_bot_branch_corpus.py
          --branch bot/harvest-human-findings
          --corpus evals/corpus-human-findings.json

      - name: Run harvest script
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          REPOS="${{ inputs.repos || vars.HARVEST_REPOS }}"
          MAINTAINERS="${{ inputs.maintainers || vars.HARVEST_MAINTAINERS }}"
          BOTS="${{ inputs.bots || vars.HARVEST_BOTS }}"
          SINCE="${{ inputs.since || vars.HARVEST_SINCE || '' }}"

          CMD=(python scripts/harvest_human_findings.py \
               --repos "$REPOS" --maintainers "$MAINTAINERS" --bots "$BOTS" \
               --corpus evals/corpus-human-findings.json)
          if [ -n "$SINCE" ]; then
            CMD+=(--since "$SINCE")
          fi

          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

      - name: Open or update the harvest PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: bot/harvest-human-findings
          BASE_BRANCH: main
          CORPUS_PATH: evals/corpus-human-findings.json
          COMMIT_MESSAGE: "chore(evals): harvest human findings from maintainer reviews"
          PR_TITLE: "chore(evals): harvest human findings"
          PR_BODY: "Automated harvest of maintainer CHANGES_REQUESTED reviews / blocking PR comments at heads the reviewer bot approved (#798). Human curation welcome before merge."
          EXPECTED_BOT_SHA: ${{ steps.merge.outputs.bot_branch_sha }}
        run: scripts/push_harvest_branch.sh
