name: Self-hosted images

# #1584: publish the #738 controller and worker runtime images to GHCR for
# the self-hosted operator canary. Manual dispatch from protected `main`
# only: the job fails closed on any other ref, the publish job never runs
# from a pull request, and the only credentials in play are the workflow's
# own GITHUB_TOKEN (contents: read, packages: write). This workflow is
# entirely separate from the Action release pipeline (release-please /
# manual-release): it writes no tags, no releases, and no dist artifacts.
#
# Both targets are built from ONE checked-out commit so the controller and
# worker images always share a runtime/protocol revision. Tags are
# immutable sha-<commit> tags: GHCR has no registry-side tag-immutability
# setting, so the job itself refuses to replace a tag that already exists
# (see the pre-push guard below). No floating `latest` and no release tag
# is pushed in this scope.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-hosted-images
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # workflow_dispatch can be started from any branch that carries this
    # file; the canary contract requires protected `main` (a reviewed,
    # protected commit), so anything else refuses here.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout the dispatch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Normalize the GHCR image owner
        # GHCR image paths must be lowercase; build the tags from the
        # lowercased owner so an uppercase owner name can never produce a
        # tag the registry would reject.
        run: echo "GHCR_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to replace a published sha tag
        # GHCR has no registry-side tag immutability (a push always
        # overwrites), so immutability is enforced here: a rebuild is not
        # byte-identical (see the Dockerfile pinning policy), so re-pushing
        # the same sha-<commit> tag would silently move it off the digest
        # the run summary published. The guard fails closed: the job
        # proceeds only when the registry explicitly answers that the tag
        # is absent, and refuses on any other error (auth, network,
        # unexpected state).
        env:
          CONTROLLER_TAG: ghcr.io/${{ env.GHCR_OWNER }}/pr-reviewer-controller:sha-${{ github.sha }}
          WORKER_TAG: ghcr.io/${{ env.GHCR_OWNER }}/pr-reviewer-worker:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          for tag in "$CONTROLLER_TAG" "$WORKER_TAG"; do
            if out=$(docker manifest inspect "$tag" 2>&1); then
              echo "::error::${tag} already exists in GHCR. sha-<commit> tags are immutable: a rerun would silently replace the published reference. Publish a new commit instead."
              exit 1
            fi
            # Fail closed: only an explicit registry absence (404
            # MANIFEST_UNKNOWN / NAME_UNKNOWN / not found) proves the tag
            # is absent. Anything else — auth, TLS ("unknown authority"),
            # network, an OCI UNKNOWN error code — refuses the run. (An
            # access denial also means this same GITHUB_TOKEN could not
            # overwrite the tag later, so refusing can never mask an
            # overwrite; at worst it fails one run loudly.)
            if ! printf '%s\n' "$out" | grep -Eqi 'manifest.unknown|name.unknown|not found'; then
              echo "registry answer for ${tag}:" >&2
              printf '%s\n' "$out" >&2
              echo "::error::cannot confirm that ${tag} is absent; refusing to push over uncertain registry state."
              exit 1
            fi
          done

      # Provenance attestations are disabled so the pushed artifact is a
      # plain single manifest: the digest reported below is then exactly
      # the digest `docker pull` / Kubernetes resolves for operators
      # pinning `image@sha256:...`.
      - name: Build and push controller (linux/amd64)
        id: controller
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/images/Dockerfile
          target: controller
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/${{ env.GHCR_OWNER }}/pr-reviewer-controller:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push worker (linux/amd64)
        id: worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/images/Dockerfile
          target: worker
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/${{ env.GHCR_OWNER }}/pr-reviewer-worker:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record published digests
        env:
          SOURCE_SHA: ${{ github.sha }}
          CONTROLLER_DIGEST: ${{ steps.controller.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
        run: |
          set -euo pipefail
          # Fail loudly on a missing digest instead of printing a bare
          # image reference in the summary.
          [ -n "$CONTROLLER_DIGEST" ] || { echo "controller digest is empty" >&2; exit 1; }
          [ -n "$WORKER_DIGEST" ] || { echo "worker digest is empty" >&2; exit 1; }
          {
            echo "## Self-hosted images published (#1584 canary)"
            echo
            echo "Source commit: \`${SOURCE_SHA}\` (both images built from this one commit)."
            echo
            echo "| image | digest reference |"
            echo "|---|---|"
            echo "| controller | \`ghcr.io/${GHCR_OWNER}/pr-reviewer-controller@${CONTROLLER_DIGEST}\` |"
            echo "| worker | \`ghcr.io/${GHCR_OWNER}/pr-reviewer-worker@${WORKER_DIGEST}\` |"
            echo
            echo "Pin the Helm controller image with the controller reference and the"
            echo "instance-config \`kubernetes.image\` with the worker reference; see"
            echo "\`deploy/images/README.md\` and \`docs/self-hosted-deployment.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
          # Surface the exact references in the job log as well.
          echo "controller: ghcr.io/${GHCR_OWNER}/pr-reviewer-controller@${CONTROLLER_DIGEST}"
          echo "worker:     ghcr.io/${GHCR_OWNER}/pr-reviewer-worker@${WORKER_DIGEST}"
