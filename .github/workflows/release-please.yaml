---
# Maintains a standing "release: X.Y.Z" PR listing everything unreleased.
# Merging it is the release decision — nothing here merges on your behalf.
#
# The app token matters twice over: a tag pushed with the default GITHUB_TOKEN
# does not trigger other workflows, and this repo's consumers pin @vX, so the
# floating major tag has to be advanced after every stable release.
name: Release Please

on:
  push:
    branches: ["main"]

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
    steps:
      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.MISO_APP_ID }}
          private-key: ${{ secrets.MISO_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  advance-major-tag:
    name: Advance floating major tag
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.MISO_APP_ID }}
          private-key: ${{ secrets.MISO_APP_PRIVATE_KEY }}

      # The sha is read back from the tag release-please just created rather
      # than taken from github.sha, so this cannot drift if the release commit
      # is ever not the commit that triggered this run.
      - name: Point vX at the release commit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          MAJOR_TAG: v${{ needs.release-please.outputs.major }}
        run: |
          set -euo pipefail
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$MAJOR_TAG" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$MAJOR_TAG" \
              -f sha="$SHA" -F force=true >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$MAJOR_TAG" -f sha="$SHA" >/dev/null
          fi
          echo "$MAJOR_TAG -> $SHA"
