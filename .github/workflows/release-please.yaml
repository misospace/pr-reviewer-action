---
# Maintains a standing "release: X.Y.Z" PR listing everything unreleased.
# Merging it is the release decision — nothing here merges on your behalf.
#
# The app token matters twice over: a tag pushed with the default GITHUB_TOKEN
# does not trigger other workflows, and this repo's consumers pin @vX, so the
# floating major tag has to be advanced after every stable release.
#
# dist/ is not committed to main. After release-please tags the release commit,
# publish-release-build commits the built bundle on top of it (off main) and
# moves both vX.Y.Z and vX to that commit.
name: Release Please

on:
  push:
    branches: ["main"]

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.MISO_APP_ID }}
          private-key: ${{ secrets.MISO_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-release-dist:
    name: Build release dist
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build
        run: npm ci --no-audit --no-fund && npm run build

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-dist
          path: dist/index.js
          if-no-files-found: error

  # Holds the tag-writing token but runs no npm: the bundle comes from the
  # credential-free build job above.
  publish-release-build:
    name: Publish release build
    needs: [release-please, build-release-dist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.MISO_APP_ID }}
          private-key: ${{ secrets.MISO_APP_PRIVATE_KEY }}

      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist

      # The base sha comes from release-please's own output, not the tag, so a
      # rerun rebuilds from the release commit rather than stacking on the
      # previous build commit. A pre-release never moves the floating major tag.
      - name: Commit dist and point vX.Y.Z and vX at it
        env:
          BASE_SHA: ${{ needs.release-please.outputs.sha }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          MAJOR_TAG: v${{ needs.release-please.outputs.major }}
        run: |
          set -euo pipefail
          [[ "$TAG" == *-* ]] && MAJOR_TAG=""
          SHA=$(scripts/release/tag-with-dist.sh "$BASE_SHA" "$TAG" "$MAJOR_TAG")
          echo "$TAG${MAJOR_TAG:+, $MAJOR_TAG} -> $SHA"

      # Consumers run the tag as-is: a clean fetch must start the node24
      # action with only the drop-in inputs.
      - name: Smoke-test the tag as consumers get it
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: scripts/release/smoke-tag.sh "$(git remote get-url origin)" "$TAG"
