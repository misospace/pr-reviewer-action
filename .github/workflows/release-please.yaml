---
# Maintains a standing "release: X.Y.Z" PR listing everything unreleased.
# Merging it is the release decision — nothing here merges on your behalf.
#
# The app token matters twice over: a tag pushed with the default GITHUB_TOKEN
# does not trigger other workflows, and this repo's consumers pin @vX, so the
# floating major tag has to be advanced after every stable release.
#
# dist/ is not committed to main. release-please only maintains the release PR
# (skip-github-release). When a release PR merges, publish-release-build commits
# the built bundle on top of the release commit (off main), smokes it as
# consumers get it, and only then points vX.Y.Z and vX at it and creates the
# GitHub Release.
name: Release Please

on:
  push:
    branches: ["main"]

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.detect.outputs.release_created }}
      tag_name: ${{ steps.detect.outputs.tag_name }}
      major: ${{ steps.detect.outputs.major }}
      sha: ${{ steps.detect.outputs.sha }}
    steps:
      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.MISO_APP_ID }}
          private-key: ${{ secrets.MISO_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please only maintains the release PR (skip-github-release):
      # it creates no tag or GitHub Release, so consumers never see a version
      # before its dist build passes the smoke. A merged release PR shows up
      # as a manifest version with no tag yet; publish-release-build owns the
      # tag and the Release from there.
      - name: Checkout pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect an unpublished release
        id: detect
        run: |
          set -euo pipefail
          VERSION="$(jq -r '."."' .release-please-manifest.json)"
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "release_created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "release_created=true"
            echo "tag_name=$TAG"
            echo "major=${VERSION%%.*}"
            echo "sha=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "unpublished release: $TAG at $GITHUB_SHA"

  build-release-dist:
    name: Build release dist
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build
        run: npm ci --no-audit --no-fund && npm run build

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-dist
          path: dist/index.js
          if-no-files-found: error

  # Holds the tag-writing token but runs no npm: the bundle comes from the
  # credential-free build job above.
  publish-release-build:
    name: Publish release build
    needs: [release-please, build-release-dist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.MISO_APP_ID }}
          private-key: ${{ secrets.MISO_APP_PRIVATE_KEY }}

      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist

      # tag-with-dist.sh smokes the build before publishing; run it on the
      # Node the action declares (runs.using: node24).
      - name: Set up Node 24 for the release smoke
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # The base sha comes from release-please's own output, not the tag, so a
      # rerun rebuilds from the release commit rather than stacking on the
      # previous build commit. A pre-release never moves the floating major tag.
      - name: Commit dist and point vX.Y.Z and vX at it
        env:
          BASE_SHA: ${{ needs.release-please.outputs.sha }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          MAJOR_TAG: v${{ needs.release-please.outputs.major }}
        run: |
          set -euo pipefail
          [[ "$TAG" == *-* ]] && MAJOR_TAG=""
          SHA=$(scripts/release/tag-with-dist.sh "$BASE_SHA" "$TAG" "$MAJOR_TAG")
          echo "$TAG${MAJOR_TAG:+, $MAJOR_TAG} -> $SHA"

      # The tag now points at the smoked dist build: create the Release
      # against it, then mark the merged release PR as tagged (release-please
      # refuses to open the next release PR while one is still pending).
      - name: Create the GitHub Release and mark the release PR tagged
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          BASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "[" v "]") || index($0, " " v " ")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          PRERELEASE=()
          [[ "$TAG" == *-* ]] && PRERELEASE=(--prerelease)
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" "${PRERELEASE[@]}"
          fi
          PR="$(gh api "repos/$GITHUB_REPOSITORY/commits/$BASE_SHA/pulls" --jq '.[0].number // empty')"
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label "autorelease: pending" --add-label "autorelease: tagged"
          fi

