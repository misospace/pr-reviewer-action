---
# Maintains a standing "release: X.Y.Z" PR listing everything unreleased.
# Merging it is the release decision — nothing here merges on your behalf.
#
# The app token matters twice over: a tag pushed with the default GITHUB_TOKEN
# does not trigger other workflows, and this repo's consumers pin @vX, so the
# floating major tag has to be advanced after every stable release.
#
# dist/ is not committed to main. release-please only maintains the release PR
# (skip-github-release). When a release PR merges, publish-release-build commits
# the built bundle on top of the release commit (off main), smokes it as
# consumers get it, and only then points vX.Y.Z and vX at it and creates the
# GitHub Release. Because vX.Y.Z is off main, release-please tracks a
# `source-vX.Y.Z` anchor tag on the release commit instead (#906).
name: Release Please

on:
  push:
    branches: ["main"]

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.detect.outputs.release_created }}
      tag_name: ${{ steps.detect.outputs.tag_name }}
      major: ${{ steps.detect.outputs.major }}
      sha: ${{ steps.detect.outputs.sha }}
      needs_build: ${{ steps.detect.outputs.needs_build }}
    steps:
      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.MISO_APP_ID }}
          private-key: ${{ secrets.MISO_APP_PRIVATE_KEY }}

      - name: Checkout pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # release-please locates the last release by its source-vX.Y.Z anchor
      # (#906). Publish the manifest version's anchor before release-please
      # runs, so a release whose publication failed part-way can never make the
      # next push regenerate a release PR from the previous version.
      - name: Anchor the manifest version on main
        run: |
          set -euo pipefail
          VERSION="$(jq -r '."."' .release-please-manifest.json)"
          SHA="$(git log -1 --format=%H -- .release-please-manifest.json)"
          scripts/release/converge.sh anchor "v$VERSION" "$SHA"

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please only maintains the release PR (skip-github-release):
      # it creates no tag or GitHub Release, so consumers never see a version
      # before its dist build passes the smoke. The release is the manifest's
      # version at the last commit that changed the manifest; it is unfinished
      # until every publication piece exists (converge.sh), so any later push
      # to main converges a partially published release.
      - name: Detect an unfinished release
        id: detect
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          VERSION="$(jq -r '."."' .release-please-manifest.json)"
          TAG="v$VERSION"
          SHA="$(git log -1 --format=%H -- .release-please-manifest.json)"
          STATE="$(scripts/release/converge.sh state "$TAG" "$SHA")"
          echo "$STATE"
          get() { printf '%s\n' "$STATE" | sed -n "s/^$1=//p"; }
          {
            echo "release_created=$([ "$(get complete)" = true ] && echo false || echo true)"
            echo "needs_build=$(get needs_build)"
            echo "tag_name=$TAG"
            echo "major=${VERSION%%.*}"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"

  build-release-dist:
    name: Build release dist
    needs: release-please
    if: needs.release-please.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build
        env:
          # #915: stamp vX.Y.Z from the manifest into the release bundle.
          PR_REVIEWER_BUILD_STAMP: release
        run: npm ci --no-audit --no-fund && npm run build

      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-dist
          path: dist/index.js
          if-no-files-found: error

  # Holds the tag-writing token but runs no npm: the bundle comes from the
  # credential-free build job above.
  publish-release-build:
    name: Publish release build
    needs: [release-please, build-release-dist]
    # Runs for any unfinished release; the build job is skipped when the
    # version tag already exists (only the remaining pieces are repaired).
    if: >-
      always() && needs.release-please.outputs.release_created == 'true'
      && (needs.build-release-dist.result == 'success' || needs.build-release-dist.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.MISO_APP_ID }}
          private-key: ${{ secrets.MISO_APP_PRIVATE_KEY }}

      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Download dist
        if: needs.release-please.outputs.needs_build == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist

      # tag-with-dist.sh smokes the build before publishing; run it on the
      # Node the action declares (runs.using: node24).
      - name: Set up Node 24 for the release smoke
        if: needs.release-please.outputs.needs_build == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # The base sha comes from release-please's own output, not the tag, so a
      # rerun rebuilds from the release commit rather than stacking on the
      # previous build commit. A pre-release never moves the floating major tag.
      - name: Commit dist and point vX.Y.Z and vX at it
        if: needs.release-please.outputs.needs_build == 'true'
        env:
          BASE_SHA: ${{ needs.release-please.outputs.sha }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          MAJOR_TAG: v${{ needs.release-please.outputs.major }}
        run: |
          set -euo pipefail
          [[ "$TAG" == *-* ]] && MAJOR_TAG=""
          SHA=$(scripts/release/tag-with-dist.sh "$BASE_SHA" "$TAG" "$MAJOR_TAG")
          echo "$TAG${MAJOR_TAG:+, $MAJOR_TAG} -> $SHA"

      # Converge the rest idempotently: a stale floating tag moves to the
      # (already smoked) version tag, a missing GitHub Release is created
      # against it, and a pending release PR is marked tagged (release-please
      # refuses to open the next release PR while one is still pending).
      - name: Finish the release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          BASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: scripts/release/converge.sh finish "$TAG" "$BASE_SHA"

