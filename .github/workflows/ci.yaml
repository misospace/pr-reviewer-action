name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  # Stable aggregate gate: branch protection requires "CI / validate", and it
  # keeps failing whenever any parallel validation job fails (the explicit
  # always()+result check matters — a merely skipped required check can be
  # treated as satisfied). The leaf jobs below split the former serial
  # validate job for wall-clock latency; no validation is weakened or skipped.
  validate:
    needs:
      - validate-typescript
      - validate-python
      - validate-static
      - validate-bash-slow
      - validate-bash
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job to pass
        # Each dependency is checked by name: a skipped, cancelled, or
        # missing result can never read as success, so a leaf that silently
        # fails to run always fails this gate (and with it branch protection).
        run: |
          set -euo pipefail
          fail=0
          for job_result in \
            "validate-typescript ${{ needs.validate-typescript.result }}" \
            "validate-python ${{ needs.validate-python.result }}" \
            "validate-static ${{ needs.validate-static.result }}" \
            "validate-bash-slow ${{ needs.validate-bash-slow.result }}" \
            "validate-bash ${{ needs.validate-bash.result }}"; do
            job="${job_result%% *}"
            result="${job_result#* }"
            echo "$job: $result"
            if [[ "$result" != "success" ]]; then
              echo "::error::$job did not pass (result: $result)"
              fail=1
            fi
          done
          exit "$fail"

  validate-typescript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate v3 TypeScript runtime
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          git diff --exit-code HEAD -- dist

  validate-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Pinned to 3.14 to match the local dev interpreter — a version skew
          # between local and CI is how the duplicate-key regression test first
          # shipped broken (passed on local 3.9, ModuleNotFoundError on CI 3.x).
          python-version: '3.14'

      - name: Install test dependencies
        run: pip install -r requirements.txt

      - name: Check Python scripts
        run: find scripts pr_reviewer tests -name '*.py' -print0 | xargs -0 python3 -m py_compile

      - name: Run offline semantic regression gate
        run: |
          mkdir -p semantic-eval-report
          python3 scripts/run_semantic_eval_ci.py \
            --corpus evals/corpus-historical-dogfood.json \
            --output semantic-eval-report/report.json

      - name: Upload semantic regression report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: semantic-eval-report
          path: semantic-eval-report/report.json
          if-no-files-found: warn

      # Coverage is scoped to pr_reviewer/ and scripts/ — the bash test suites
      # cover the shell side, which pytest-cov can't measure.
      # Threshold: measured baseline was 76% (2026-07-03); gate at 72 to absorb
      # small fluctuations. Ratchet toward the audit's 80% as coverage grows.
      - name: Run Python tests (auto-discover all 215)
        run: |
          COV_FAIL_UNDER=72
          pytest tests/ -v --tb=short \
            --cov=pr_reviewer --cov=scripts \
            --cov-report=term-missing:skip-covered \
            --cov-fail-under="$COV_FAIL_UNDER"

  validate-static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the gitleaks CLI below can scan every commit, not
          # just the PR merge ref of a shallow checkout.
          fetch-depth: 0

      - name: Install lint dependencies
        # Same pinned set as validate-python; this job only needs yamllint
        # from it. Keeping one requirements file means one supply-chain pin.
        run: pip install -r requirements.txt

      - name: Validate action metadata YAML
        run: ruby -e 'require "yaml"; YAML.load_file("action.yml")'

      - name: Validate example workflow YAML
        run: ruby -e 'require "yaml"; YAML.load_file("examples/workflow-self-hosted.yml"); YAML.load_file("examples/workflow-cloud.yml")'

      # GitHub's Actions runner rejects a mapping with a duplicate key at load
      # time ("'X' is already defined") — but ruby/python YAML loaders silently
      # keep the last value, so the loads above pass on a manifest the runner
      # would reject. This shipped the broken v1.2.10 (duplicate PLATFORM in
      # three env: blocks, #255). yamllint's key-duplicates rule catches the
      # whole class at any nesting depth, across the manifest and every workflow.
      - name: Lint for duplicate YAML keys
        run: |
          yamllint -d "{rules: {key-duplicates: enable}}" \
            action.yml \
            contracts/action-v3.yml \
            .github/workflows/*.yaml \
            examples/*.yml

      - name: Lint GitHub Actions workflows
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

      # Secret scan: this action forwards operator PATs and AI_API_KEYs, so a
      # hardcoded credential in a committed diff is exactly the regression class
      # the redaction work (#471, #360) guards against. The official license-free
      # gitleaks CLI (image pinned by digest) scans the full checkout history —
      # the checkout above uses fetch-depth 0 — on every run, failing the build
      # on any detection. .gitleaks.toml allowlists the intentionally fake
      # credential fixtures in the redaction test suites.
      - name: Scan for leaked secrets (gitleaks)
        uses: docker://ghcr.io/gitleaks/gitleaks@sha256:090a2715530bd6592342e6a66c3f35eafcaaf2a3227a312482504f9c854997e3
        with:
          args: git --config /github/workspace/.gitleaks.toml --no-banner --redact /github/workspace

      - name: Check shell scripts
        run: |
          set -euo pipefail
          for f in scripts/*.sh tests/*.sh; do
            bash -n "$f"
          done

      - name: Lint shell scripts with shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck

      - name: Verify smoke test helper is executable
        run: test -x tests/smoke_test.sh

      - name: Verify Forgejo E2E smoke harness parses
        run: bash -n tests/forgejo_e2e_smoke.sh

  # The two longest bash suites (CI-status gating and concurrent gating) get
  # their own runner instead of queueing every other suite behind them. The
  # suite list lives in tests/slow-bash-suites.txt, which is the single source
  # of truth shared with validate-bash's exclusion below.
  validate-bash-slow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Same pinned interpreter as validate-python so bash suites that shell
          # out to python3 see the same version (see the skew note above).
          python-version: '3.14'

      - name: Install test dependencies
        # Some suites import PyYAML in inline python (it arrives transitively
        # via yamllint in requirements.txt), so the bash jobs need the same
        # pinned install the old serial job provided.
        run: pip install -r requirements.txt

      - name: Run long-running bash test suites
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r t; do
            [[ -z "$t" ]] && continue
            echo "::group::$t"
            if ! bash "$t"; then
              echo "::error::$t failed"
              failed=1
            fi
            echo "::endgroup::"
          done < tests/slow-bash-suites.txt
          exit "$failed"

  validate-bash:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Same pinned interpreter as validate-python so bash suites that shell
          # out to python3 see the same version (see the skew note above).
          python-version: '3.14'

      - name: Install test dependencies
        # See the note in validate-bash-slow: suites import PyYAML transitively.
        run: pip install -r requirements.txt

      - name: Run smoke test
        run: tests/smoke_test.sh

      # Auto-discover every bash suite except the slow ones listed in
      # tests/slow-bash-suites.txt (run by validate-bash-slow) so a new (or
      # previously unlisted) suite cannot silently stay out of CI.
      - name: Run bash test suites (auto-discover)
        run: |
          set -euo pipefail
          failed=0
          for t in tests/test_*.sh; do
            if grep -Fxq "$t" tests/slow-bash-suites.txt; then
              continue
            fi
            echo "::group::$t"
            if ! bash "$t"; then
              echo "::error::$t failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
