name: Publish images

# #1704: publish the #738 controller and worker runtime images to GHCR for
# every publishable revision, not just the #1584 manual canary. The workflow
# runs for pull requests targeting `main`, pushes to protected `main`, pushes
# of exact `vX.Y.Z` release tags, and manual dispatch (recovery/testing). The
# floating git major tag (`v3`), which the release pipeline moves on every
# stable release, matches no filter here and never starts a run (#1742).
# Every run builds BOTH targets from ONE checked-out commit so the controller
# and worker images always share a runtime/protocol revision.
#
# Tag scheme (no `latest` anywhere):
#   - `sha-<commit>` — immutable, published for every run from this workflow.
#     For pull_request events the ref pins the PR HEAD commit
#     (`github.event.pull_request.head.sha`), not the merge commit
#     `github.sha` points at, so a qualification can address the reviewed
#     head directly. The checkout step pins that same ref explicitly — a
#     default pull_request checkout would otherwise build the synthetic
#     merge commit while the tags still claim sha-<head> — and the publish
#     job asserts the checked-out HEAD equals SOURCE_SHA before anything
#     is tagged.
#   - `pr-<number>`  — moving ref for same-repository PRs only (the publish
#     job below refuses fork PRs); each underlying commit stays addressable
#     by its immutable `sha-<commit>` ref.
#   - `<X.Y.Z>` — the ONLY release alias (#1742), published for a strictly
#     validated `vX.Y.Z` tag push, from that exact tagged commit. No
#     floating alias of any shape (no `major`, no `major.minor`, no
#     `latest`): a container image tag is what a cluster pulls, so images
#     publish exact coordinates only. The Helm chart (#1708,
#     `.github/workflows/publish-chart.yaml`) publishes exact SemVer OCI
#     tags too — Helm rejects non-SemVer OCI tags — so no floating image
#     or chart OCI alias exists today. The Action's own floating git major
#     tag (`vX`, moved by release-please/manual-release) is a separate
#     surface for `uses:` consumers, and it deliberately does not trigger
#     this workflow (#1742): a `vX` tag push would only start a run the
#     strict validation below must refuse.
#
# Trust boundary (preserved from #1584 and sharpened): fork pull requests
# never enter the `publish` job — they run `build-fork-pr`, which holds
# `contents: read` only, never logs in to GHCR, and pushes nothing. Only the
# `publish` job (same-repo PRs, `main`, release tags, dispatch) carries
# `packages: write` and the workflow's own GITHUB_TOKEN. This workflow is
# still entirely separate from the Action release pipeline (release-please /
# manual-release): it writes no git tags, no releases, and no dist artifacts.
#
# GHCR has no registry-side tag-immutability setting, so the publish job
# itself never re-pushes a `sha-<commit>` tag that already exists (see the
# per-target resolver below). A rerun instead RESUMES a partially published
# controller/worker pair (#1741): a present target is reused and its digest
# reported, an absent one is built and pushed, and only an ambiguous registry
# answer fails the run closed. The `pr-<number>` ref is the only intentionally
# moving ref, and EVERY moving-ref write — freshly published or retagged —
# comes only from the guarded republish step, never from a build step: the
# run first confirms it is still the live coordinate behind that ref, so a
# rerun of a superseded run fails closed instead of moving a moving ref
# backward.
#
# Note on metadata-action: the Dispatch reference workflow tags the SHA ref
# via docker/metadata-action's `type=sha`, which for pull_request events
# tags the merge commit. This contract requires `sha-<head>` on PRs, so the
# tags are computed explicitly below instead of via metadata-action —
# same trigger/tag model, with the SHA context this contract needs.
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    # #1742: exact release tags only. GitHub filter patterns are globs, not
    # regex, but they support character classes with the `+` quantifier
    # (documented example: `v[12].[0-9]+.[0-9]+`), so this filter never
    # starts a run for the floating major tag (`v3`) or a floating `vX.Y`
    # ref that release tooling moves. Such a run could only fail the strict
    # validation in Resolve publish coordinates: the spurious alarm #1742
    # removes. That strict check stays regardless: the filter decides which
    # runs start, the check is what guarantees a tag push never derives a
    # wrong alias, and it keeps holding if this filter is ever widened.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Same-repository pull requests, `main` pushes, exact `vX.Y.Z` tag
    # pushes and manual dispatch publish. A fork pull_request event never
    # enters this job (its head repository differs), so untrusted code can
    # never reach the GHCR credentials held here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout the source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Build exactly the commit the tags name. pull_request events
          # default actions/checkout to the synthetic merge commit
          # (refs/pull/<n>/merge), which would tag sha-<head> on an
          # artifact built from the merge commit — so the ref is pinned to
          # the PR head here, with the pushed commit as the fallback for
          # push and dispatch events.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Normalize the GHCR image owner
        # GHCR image paths must be lowercase; build the tags from the
        # lowercased owner so an uppercase owner name can never produce a
        # tag the registry would reject.
        run: echo "GHCR_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Resolve publish coordinates
        # SOURCE_SHA is the immutable-ref anchor: the PR HEAD commit for
        # pull_request events (github.sha points at the merge commit there),
        # the pushed/dispatched commit for every other event. The moving
        # `pr-<number>` ref and the exact SemVer release alias are derived from
        # strictly validated event context; anything that does not parse is
        # a hard failure, never a silently different tag.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          GIT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            SOURCE_SHA="$PR_HEAD_SHA"
          else
            SOURCE_SHA="$DEFAULT_SHA"
          fi
          [ -n "$SOURCE_SHA" ] || { echo "cannot resolve the source commit" >&2; exit 1; }
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

          # The tags and the build context must name the same commit: the
          # checkout step above pinned exactly SOURCE_SHA, so assert the
          # working tree really is that commit before anything is tagged.
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          [ "$CHECKED_OUT_SHA" = "$SOURCE_SHA" ] || {
            echo "checked-out commit ${CHECKED_OUT_SHA} is not SOURCE_SHA ${SOURCE_SHA}; refusing to tag a mismatched artifact" >&2
            exit 1
          }

          # Moving PR ref, same-repo PRs only (the job's `if` keeps fork PRs
          # out of this job; this branch can only fire for a same-repo PR).
          PR_REF=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            [ -n "$PR_NUMBER" ] || { echo "pull_request event without a PR number" >&2; exit 1; }
            PR_REF="pr-$PR_NUMBER"
          fi
          echo "PR_REF=$PR_REF" >> "$GITHUB_ENV"

          # The release alias is the exact vX.Y.Z only (#1742): no
          # floating major or major.minor alias is derived, and anything
          # else (including v-prefixed non-semver refs) refuses the run
          # rather than deriving a wrong alias.
          RELEASE_VERSION=""
          if [ "$EVENT_NAME" = "push" ]; then
            case "$GIT_REF" in
              refs/tags/*)
                version="${REF_NAME#v}"
                if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
                  echo "::error::release tag ${REF_NAME} is not v<major>.<minor>.<patch>; refusing to derive a release alias."
                  exit 1
                fi
                RELEASE_VERSION="$version"
                ;;
            esac
          fi
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve published sha-tag state (resume a partial pair)
        # GHCR has no registry-side tag immutability (a push always
        # overwrites), so immutability is enforced here: a rebuild is not
        # byte-identical (see the Dockerfile pinning policy), so re-pushing
        # an existing sha-<commit> tag would silently move it off the digest
        # the run summary published. But the guard must not refuse the whole
        # run when only PART of the pair is published (#1741): a run that
        # pushed the controller and then failed on the worker has to finish
        # that commit's pair on a rerun, never cut a new commit that leaves
        # the original release with a controller ref and no worker.
        #
        # So the state is resolved PER TARGET: a present tag is reused (its
        # digest captured, never re-pushed by the gated build below), an
        # explicitly-absent tag is built and pushed, and any ambiguous
        # registry answer — or a present tag whose digest cannot be read —
        # fails the run CLOSED. The step runs before the first push.
        id: sha_state
        env:
          CONTROLLER_TAG: ghcr.io/${{ env.GHCR_OWNER }}/pr-reviewer-controller:sha-${{ env.SOURCE_SHA }}
          WORKER_TAG: ghcr.io/${{ env.GHCR_OWNER }}/pr-reviewer-worker:sha-${{ env.SOURCE_SHA }}
        run: bash deploy/images/resolve-sha-tag-state.sh

      # Provenance attestations are disabled so the pushed artifact is a
      # plain single manifest: the digest reported below is then exactly
      # the digest `docker pull` / Kubernetes resolves for operators
      # pinning `image@sha256:...`.
      #
      # The immutable `sha-<SOURCE_SHA>` tag publishes whenever that target's
      # sha tag is absent; a target whose sha tag is already present is reused
      # untouched (#1741), so a rerun finishes a half-published pair without
      # moving any existing ref. The build step pushes ONLY the immutable sha
      # ref: every moving ref (the `pr-<number>` alias and the exact SemVer
      # release alias — #1742: no floating alias of any shape) is written by
      # the guarded alias step below — for freshly built AND reused targets
      # alike — because a build step has no supersession check, and an ungated
      # alias push there could move a moving ref before the guard ever runs.
      # The GHA cache is written
      # only for non-PR runs — PR builds read it but never export, so a PR
      # cannot rewrite the cache the `main` builds consume.
      - name: Build and push controller (linux/amd64)
        id: controller
        # #1741: push only when the controller's sha-<commit> tag is absent.
        # When it is already present the resolver reused it, and re-running
        # must not rebuild and re-push that immutable ref. The push carries
        # only the immutable sha ref; the target's moving refs are written by
        # the guarded alias step below, for reused AND freshly built targets.
        if: steps.sha_state.outputs.controller_state == 'absent'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/images/Dockerfile
          target: controller
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/pr-reviewer-controller:sha-${{ env.SOURCE_SHA }}
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

      - name: Build and push worker (linux/amd64)
        id: worker
        # #1741: push only when the worker's sha-<commit> tag is absent; a
        # present worker tag is reused so a rerun never moves it. The push
        # carries only the immutable sha ref; moving refs are written by the
        # guarded alias step below, for reused AND freshly built targets.
        if: steps.sha_state.outputs.worker_state == 'absent'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/images/Dockerfile
          target: worker
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/pr-reviewer-worker:sha-${{ env.SOURCE_SHA }}
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

      - name: Publish moving refs behind the live-coordinate guard
        # #1741 review: gating the build-push steps on the target's sha-tag
        # state also skipped that target's pr-<number>/exact SemVer alias
        # pushes (#1742: no floating alias of any shape), so a run that died
        # after the sha push but before the aliases could never republish
        # them. Moving refs may legally be retagged, so the script below
        # writes them for EVERY target (reused or freshly built) at the exact
        # manifest the immutable sha tag holds — no rebuild, so a moving ref
        # can never drift off the immutable digest. This step is the ONLY
        # writer of moving refs: the build steps push nothing but the
        # immutable sha ref, because they have no supersession check and an
        # ungated alias push there could move a moving ref before any guard
        # ran.
        # But "legally retagged" is only true for the run that still OWNS the
        # coordinate: a rerun of a SUPERSEDED workflow run must not repoint
        # pr-<number> backward at the older commit (the pre-#1741 run simply
        # refused there). The script therefore confirms through the forge API
        # — the PR HEAD ref, or the tagged commit behind the release tag —
        # that SOURCE_SHA is still the live coordinate before any moving-ref
        # write, and fails the run closed (writing nothing) on a superseded or
        # otherwise uncertain answer. The token travels header-only via a curl
        # config on stdin; runs with no moving refs to write never use it.
        env:
          GHCR_OWNER: ${{ env.GHCR_OWNER }}
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
          PR_REF: ${{ env.PR_REF }}
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          CONTROLLER_STATE: ${{ steps.sha_state.outputs.controller_state }}
          WORKER_STATE: ${{ steps.sha_state.outputs.worker_state }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash deploy/images/republish-moving-refs.sh

      - name: Record published digests
        # Each digest is either the reused reference the resolver read for a
        # tag that was already published (#1741) or the freshly built digest
        # from the gated build step. Exactly one source is set per target, so
        # the summary always reports BOTH images of the pair for this commit —
        # the recovery run finishes the pair it did not build itself.
        env:
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
          PR_REF: ${{ env.PR_REF }}
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          CONTROLLER_STATE: ${{ steps.sha_state.outputs.controller_state }}
          WORKER_STATE: ${{ steps.sha_state.outputs.worker_state }}
          RESOLVED_CONTROLLER_DIGEST: ${{ steps.sha_state.outputs.controller_digest }}
          RESOLVED_WORKER_DIGEST: ${{ steps.sha_state.outputs.worker_digest }}
          BUILT_CONTROLLER_DIGEST: ${{ steps.controller.outputs.digest }}
          BUILT_WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
        run: |
          set -euo pipefail
          # A reused tag's digest comes from the resolver; a freshly pushed
          # one from the build step. Prefer the reused digest so a resume run
          # reports the immutable reference it preserved, not a rebuild.
          CONTROLLER_DIGEST="${RESOLVED_CONTROLLER_DIGEST:-$BUILT_CONTROLLER_DIGEST}"
          WORKER_DIGEST="${RESOLVED_WORKER_DIGEST:-$BUILT_WORKER_DIGEST}"
          # Human-readable list of targets whose immutable tag was reused, for
          # the summary's resume note.
          REUSED=""
          [ "$CONTROLLER_STATE" = "present" ] && REUSED="controller"
          [ "$WORKER_STATE" = "present" ] && REUSED="${REUSED:+$REUSED, }worker"
          # Fail loudly on a missing digest instead of printing a bare
          # image reference in the summary.
          [ -n "$CONTROLLER_DIGEST" ] || { echo "controller digest is empty" >&2; exit 1; }
          [ -n "$WORKER_DIGEST" ] || { echo "worker digest is empty" >&2; exit 1; }
          {
            echo "## Self-hosted images published (#1704)"
            echo
            echo "Trigger: \`${GITHUB_EVENT_NAME}\`. Source commit: \`${SOURCE_SHA}\` (the commit both image refs are published from)."
            if [ -n "$REUSED" ]; then
              echo
              echo "Resume run (#1741): reused the existing \`sha-${SOURCE_SHA}\` ref for ${REUSED} (never moved); published only the target(s) whose sha ref was absent."
            fi
            echo
            echo "| image | digest reference |"
            echo "|---|---|"
            echo "| controller | \`ghcr.io/${GHCR_OWNER}/pr-reviewer-controller@${CONTROLLER_DIGEST}\` |"
            echo "| worker | \`ghcr.io/${GHCR_OWNER}/pr-reviewer-worker@${WORKER_DIGEST}\` |"
            echo
            echo "Immutable SHA refs: \`pr-reviewer-controller:sha-${SOURCE_SHA}\`, \`pr-reviewer-worker:sha-${SOURCE_SHA}\`."
            if [ -n "$PR_REF" ]; then
              echo "Moving PR refs: \`pr-reviewer-controller:${PR_REF}\`, \`pr-reviewer-worker:${PR_REF}\`."
            fi
            if [ -n "$RELEASE_VERSION" ]; then
              echo "Release refs: \`pr-reviewer-controller:${RELEASE_VERSION}\`, \`pr-reviewer-worker:${RELEASE_VERSION}\` (exact SemVer only, #1742)."
            fi
            echo
            echo "Pin the Helm controller image with the controller reference and the"
            echo "instance-config \`kubernetes.image\` with the worker reference; see"
            echo "\`deploy/images/README.md\` and \`docs/self-hosted-deployment.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
          # Surface the exact references in the job log as well.
          echo "controller: ghcr.io/${GHCR_OWNER}/pr-reviewer-controller@${CONTROLLER_DIGEST}"
          echo "worker:     ghcr.io/${GHCR_OWNER}/pr-reviewer-worker@${WORKER_DIGEST}"

  build-fork-pr:
    # Fork pull requests build and validate both targets but receive no
    # GHCR credentials: `contents: read` only, no login, no push. This job
    # is the only surface fork-PR code can reach, and it publishes nothing.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Validate the actual PR HEAD commit, not the synthetic merge
          # commit the default pull_request checkout builds: the summary
          # below reports this commit as the build source.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Local builds only (push: false, load: true) with throwaway tags.
      # No cache export: fork code never writes the cache the `main`
      # builds read.
      - name: Build controller (linux/amd64, validation only)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/images/Dockerfile
          target: controller
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          tags: pr-reviewer-controller:ci
          cache-from: type=gha

      - name: Build worker (linux/amd64, validation only)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/images/Dockerfile
          target: worker
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          tags: pr-reviewer-worker:ci
          cache-from: type=gha

      - name: Validate the built controller image
        run: |
          set -euo pipefail
          # The runtime contract from deploy/images/Dockerfile: exec-form
          # node entrypoint, controller subcommand, non-root user.
          entrypoint=$(docker image inspect --format '{{json .Config.Entrypoint}}' pr-reviewer-controller:ci)
          cmd=$(docker image inspect --format '{{json .Config.Cmd}}' pr-reviewer-controller:ci)
          echo "controller entrypoint=${entrypoint} cmd=${cmd}"
          if [ "$entrypoint" != '["node","/app/dist/index.js"]' ]; then
            echo "::error::controller entrypoint drifted from the runtime contract: ${entrypoint}"
            exit 1
          fi
          if [ "$cmd" != '["controller"]' ]; then
            echo "::error::controller cmd drifted from the runtime contract: ${cmd}"
            exit 1
          fi
          # The runtime node executes inside the built image.
          docker run --rm --entrypoint node pr-reviewer-controller:ci --version

      - name: Validate the built worker image
        run: |
          set -euo pipefail
          entrypoint=$(docker image inspect --format '{{json .Config.Entrypoint}}' pr-reviewer-worker:ci)
          cmd=$(docker image inspect --format '{{json .Config.Cmd}}' pr-reviewer-worker:ci)
          echo "worker entrypoint=${entrypoint} cmd=${cmd}"
          if [ "$entrypoint" != '["node","/app/dist/index.js"]' ]; then
            echo "::error::worker entrypoint drifted from the runtime contract: ${entrypoint}"
            exit 1
          fi
          if [ "$cmd" != '["worker"]' ]; then
            echo "::error::worker cmd drifted from the runtime contract: ${cmd}"
            exit 1
          fi
          docker run --rm --entrypoint node pr-reviewer-worker:ci --version

      - name: Record fork-PR build result
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          {
            echo "## Self-hosted images built (fork PR, validation only)"
            echo
            echo "Source commit: \`${SOURCE_SHA}\`. Both targets built and validated locally."
            echo
            echo "No image was published: fork pull requests receive no GHCR"
            echo "credentials and cannot move any tag. The same-repo PR flow"
            echo "(or a merge to \`main\`) publishes the images."
          } >> "$GITHUB_STEP_SUMMARY"
