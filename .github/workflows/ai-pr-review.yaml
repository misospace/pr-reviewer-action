name: AI PR Review

on:
  pull_request:
    # Deliberately unfiltered by base branch. A `branches: ["main"]` filter is
    # evaluated against the BASE ref, so a stacked PR — one opened against
    # another in-flight branch, the normal way to split a change into reviewable
    # parts — never matched and was silently never reviewed. No check appeared
    # to explain the absence, and neither the `ai-review` label nor
    # workflow_dispatch could recover it: the filter applies to every activity
    # type, and the review step below is gated on `pull_request`.
    #
    # `labeled` enables the one-click re-review: add the `ai-review` label to
    # force a fresh review (only write/triage can label — self-authorizing).
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  issue_comment:
    # `created` enables the comment re-review: a PR comment whose body is
    # exactly `rereview-command` (default `/ai-review`; bare command only in
    # v1, no arguments — trailing text never triggers) forces a fresh full
    # review. The commenter needs triage-or-higher repo permission (checked
    # via the API, failing closed); fork PRs only get a reply pointing at
    # the `ai-review-fork` label workflow. Empty `rereview-command` disables
    # it.
    types: [created]
  workflow_dispatch:

concurrency:
  # `labeled` events get their own group so an auto-applied label can't cancel
  # the in-flight opened/synchronize review (see README → Forcing a re-review).
  # `issue_comment` re-reviews get a `-comment-<issue>` suffix keyed on the
  # issue number so a comment-triggered run can't cancel an in-flight
  # push/label review of the same PR (and vice versa).
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && format('-label-{0}', github.run_id) || '' }}${{ github.event_name == 'issue_comment' && format('-comment-{0}', github.event.issue.number) || '' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Same-repository PRs (and manual dispatch) only. Cross-repository
    # (fork) PRs are handled by the privileged fork-ai-review workflow
    # (workflow_run after CI completes + label-gated pull_request_target).
    # This job used to fail noisily at the app-token step for forks — fork
    # pull_request runs never receive secrets — so it now skips them
    # cleanly instead. The two paths are separate security domains: never
    # merge them.
    #
    # `issue_comment` runs only when the comment is on a PR (the
    # `issue.pull_request` relation is present); a plain-issue comment is a
    # no-op. Fork PRs do pass this gate, but the pr-gate step below resolves
    # the PR through the API and routes them to a base-repo checkout — the
    # action then replies and no-ops on fork comments.
    if: ${{ github.event_name != 'pull_request' && github.event_name != 'issue_comment' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.id == github.repository_id && !github.event.pull_request.draft) || (github.event_name == 'issue_comment' && github.event.issue.pull_request) }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR through the API (pr-gate)
        id: pr-gate
        # SECURITY: this must run BEFORE any checkout or build. The
        # issue_comment payload carries no head SHA, so the action fetches the
        # PR itself. For a fork PR we must never check out or build its head
        # code in this privileged (base-repo-secrets) run — resolving the PR
        # through the API first lets us read the head repo id and route a fork
        # to a base-repo checkout. The action replies and no-ops on fork
        # comments, so the base-repo checkout is safe for that path.
        if: github.event_name == 'issue_comment'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO_ID: ${{ github.repository_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Untrusted DATA: the comment body is only ever read by node via
          # env, never interpolated into shell text, logged, or written to
          # output.
          COMMENT_BODY: ${{ github.event.comment.body }}
          REREVIEW_DEFAULT_COMMAND: /ai-review
        run: |
          set -euo pipefail
          # Pre-filter: skip the rest of the pipeline when this comment
          # provably cannot be the re-review command.
          # (a) Skipping only happens on a PROVABLY non-matching body: the
          #     check below is the action's own matcher, so a body the
          #     action would accept always passes.
          # (b) The node one-liner is the same expression as
          #     commentBodyTriggersCommentCommand in src/precheck/decide.ts
          #     (strip leading whitespace via /^\s+/, literal
          #     startsWith(command), remainder trimEnd() === ""; an empty
          #     command never triggers). A test pins the workflow-side
          #     primitives; if the TS matcher ever diverges, keep them in
          #     sync — divergence here fails safe (a dropped re-review
          #     trigger that relabels/awaits), never a false review.
          # (c) The effective command is exactly REREVIEW_DEFAULT_COMMAND
          #     because this workflow sets no rereview-command input and
          #     rereview-command is not repo-configurable — both assumptions
          #     are pinned by tests/test_dogfood_workflow.py.
          may_trigger="$(node -e 'const body = process.env.COMMENT_BODY ?? ""; const command = process.env.REREVIEW_DEFAULT_COMMAND; const trimmed = body.replace(/^\s+/, ""); process.stdout.write(command !== "" && trimmed.startsWith(command) && trimmed.slice(command.length).trimEnd() === "" ? "true" : "false")')"
          if [ "$may_trigger" != "true" ]; then
            echo "may_trigger=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A forge-API outage must not turn every command comment into a red
          # job: retry the lookup, then fail SOFT with a clean skip. The
          # trigger is dropped (recoverable by re-commenting or the ai-review
          # label), which can never grant a review — the fail-safe direction.
          # Only fixed-constant text reaches the summary: no payload, id, or
          # token value.
          if ! pr_json="$(curl -fsS --retry 3 --retry-all-errors --retry-delay 2 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${ISSUE_NUMBER}")"; then
            echo "may_trigger=false" >> "$GITHUB_OUTPUT"
            echo 'pr-gate: pull request lookup failed after retries; skipping this comment-triggered re-review. Add the ai-review label to force a review.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "may_trigger=true" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r '.head.sha' <<<"$pr_json")" >> "$GITHUB_OUTPUT"
          head_repo_id="$(jq -r '.head.repo.id' <<<"$pr_json")"
          if [ "$head_repo_id" != "$REPO_ID" ]; then
            echo "is_fork=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_fork=false" >> "$GITHUB_OUTPUT"
          fi
          echo "is_draft=$(jq -r '.draft' <<<"$pr_json")" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        # Draft exclusion mirrors the later steps: a comment-triggered run on a
        # draft PR must not even check out or mint a token (#914 review).
        if: github.event_name != 'issue_comment' || (steps.pr-gate.outputs.may_trigger == 'true' && steps.pr-gate.outputs.is_draft != 'true')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Same-repo comment re-review → the PR head sha resolved by the
          # pr-gate (pinned at gate time, so a mid-run push can't race the
          # stamp below); fork comment → the base-repo github.sha (never the
          # fork head); pull_request → the PR head; workflow_dispatch → the
          # default-branch github.sha. This exact expression is also
          # PR_REVIEWER_BUILD_SHA below — the stamp must name what is built
          # (#941).
          ref: ${{ github.event_name == 'issue_comment' && (steps.pr-gate.outputs.is_fork == 'true' && github.sha || steps.pr-gate.outputs.head_sha) || github.event.pull_request.head.sha || github.sha }}

      - name: Generate bot token
        id: app-token
        # Draft exclusion mirrors the later steps: a comment-triggered run on a
        # draft PR must not even check out or mint a token (#914 review).
        if: github.event_name != 'issue_comment' || (steps.pr-gate.outputs.may_trigger == 'true' && steps.pr-gate.outputs.is_draft != 'true')
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Set up Node 24
        # Only to build the bundle below; the action itself runs on the
        # runner's own node24 (`runs.using: node24`). Runs for pull_request
        # and issue_comment re-reviews; skipped for workflow_dispatch and for
        # draft comment runs (a draft PR is never reviewed).
        if: github.event_name != 'workflow_dispatch' && steps.pr-gate.outputs.is_draft != 'true' && (github.event_name != 'issue_comment' || steps.pr-gate.outputs.may_trigger == 'true')
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Build the action bundle
        # The action ships dist/ only on release tags (#787); this dogfood job
        # reviews each PR with its own source, so it builds the bundle first.
        # Consumers of a release tag need none of this.
        if: github.event_name != 'workflow_dispatch' && steps.pr-gate.outputs.is_draft != 'true' && (github.event_name != 'issue_comment' || steps.pr-gate.outputs.may_trigger == 'true')
        env:
          # #915: dogfood builds review PR source; stamp vX.Y.Z-dev+<short sha> so each review names the commit that produced it.
          PR_REVIEWER_BUILD_STAMP: dev
          # The stamp must name what this job checked out: the PR head. For a
          # pull_request event GITHUB_SHA is the synthetic merge ref, not the
          # source being built, so the build sha is passed explicitly — the
          # same expression as the checkout ref above (#941).
          PR_REVIEWER_BUILD_SHA: ${{ github.event_name == 'issue_comment' && (steps.pr-gate.outputs.is_fork == 'true' && github.sha || steps.pr-gate.outputs.head_sha) || github.event.pull_request.head.sha || github.sha }}
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Review PR with reusable AI reviewer
        if: github.event_name != 'workflow_dispatch' && steps.pr-gate.outputs.is_draft != 'true' && (github.event_name != 'issue_comment' || steps.pr-gate.outputs.may_trigger == 'true')
        id: review
        # `./` is the checkout at the PR head, where the step above built
        # dist/, so every PR is reviewed by its own in-flight action code.
        # (`$/` would fetch a separate copy of the ref without dist/.) Fork
        # pull_request runs never reach this step: the job-level `if` skips
        # them. A `/ai-review` comment on a fork PR does reach it — from the
        # base-repo checkout the pr-gate routed it to — and the action itself
        # replies and no-ops there (`comment-fork-pr`); fork code is never
        # built or executed with base-repo secrets.
        env:
          # #914: the head sha the pr-gate resolved and the checkout step
          # checked out and built. The precheck compares it against the head
          # of the freshly fetched PR and skips (superseded-head) when a push
          # raced the gate, so a built action never posts a verdict stamped
          # with a head it did not review. Empty for non-comment runs: the
          # guard is inert without a pin.
          PR_REVIEWER_GATE_HEAD_SHA: ${{ steps.pr-gate.outputs.head_sha }}
        uses: ./
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          ai-base-url: ${{ vars.LITELLM_URL }}
          ai-api-format: ${{ vars.PRIMARY_FORMAT }}
          ai-model: ${{ vars.PRIMARY_MODEL }}
          primary-model-context-tokens: ${{ vars.PRIMARY_CONTEXT_TOKENS }}
          ai-api-key: ${{ secrets.LITELLM_API_KEY }}
          ai-response-format: json_object
          ai-fallback-base-url: ${{ vars.LITELLM_URL }}
          ai-fallback-api-format: ${{ vars.FALLBACK_FORMAT }}
          ai-fallback-model: ${{ vars.FALLBACK_MODEL }}
          fallback-model-context-tokens: ${{ vars.FALLBACK_CONTEXT_TOKENS }}
          ai-fallback-api-key: ${{ secrets.LITELLM_API_KEY }}
          review-routing-mode: auto
          ai-smart-base-url: ${{ vars.LITELLM_URL }}
          ai-smart-api-format: ${{ vars.SMART_FORMAT }}
          ai-smart-model: ${{ vars.SMART_MODEL }}
          smart-model-context-tokens: ${{ vars.SMART_CONTEXT_TOKENS }}
          ai-smart-api-key: ${{ secrets.LITELLM_API_KEY }}
          ci-timeout-sec: "600"
          tool-allowed-gh-api-repos: "*"
          claim-falsification: "true"
          equivalent-paths: "true"
          requirement-trace: "true"
          publish-mode: review_verdict
          allow-approve: "true"
