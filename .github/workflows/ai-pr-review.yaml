name: AI PR Review

on:
  pull_request:
    # Deliberately unfiltered by base branch. A `branches: ["main"]` filter is
    # evaluated against the BASE ref, so a stacked PR — one opened against
    # another in-flight branch, the normal way to split a change into reviewable
    # parts — never matched and was silently never reviewed. No check appeared
    # to explain the absence, and neither the `ai-review` label nor
    # workflow_dispatch could recover it: the filter applies to every activity
    # type, and the review step below is gated on `pull_request`.
    #
    # `labeled` enables the one-click re-review: add the `ai-review` label to
    # force a fresh review (only write/triage can label — self-authorizing).
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  workflow_dispatch:

concurrency:
  # `labeled` events get their own group so an auto-applied label can't cancel
  # the in-flight opened/synchronize review (see README → Forcing a re-review).
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Same-repository PRs (and manual dispatch) only. Cross-repository
    # (fork) PRs are handled by the privileged fork-ai-review workflow
    # (workflow_run after CI completes + label-gated pull_request_target).
    # This job used to fail noisily at the app-token step for forks — fork
    # pull_request runs never receive secrets — so it now skips them
    # cleanly instead. The two paths are separate security domains: never
    # merge them.
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.id == github.repository_id && !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Review PR with reusable AI reviewer
        if: github.event_name == 'pull_request'
        id: review
        # Dogfood: `$/` resolves to this repository at the running commit, so
        # every PR is reviewed by its own in-flight action code instead of the
        # last release — a PR that breaks the manifest or publish path now
        # fails its own review before it can ship. Also ends the renovate
        # self-pin churn. Requires runner >= 2.336.0
        # (github.com hosted runners qualify; not available on GHES).
        # Fork PRs never reach this step: the job-level `if` skips
        # cross-repository PRs, which are reviewed by the separate
        # privileged fork-ai-review workflow instead.
        uses: $/
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          ai_primary_retries: "3"
          ai_primary_retry_delay_sec: "15"
          ai_base_url: ${{ vars.LITELLM_URL }}
          ai_api_format: ${{ vars.PRIMARY_FORMAT }}
          ai_model: ${{ vars.PRIMARY_MODEL }}
          ai_api_key: ${{ secrets.LITELLM_API_KEY }}
          ai_response_format: json_object
          ai_fallback_base_url: ${{ vars.LITELLM_URL }}
          ai_fallback_api_format: ${{ vars.FALLBACK_FORMAT }}
          ai_fallback_model: ${{ vars.FALLBACK_MODEL }}
          ai_fallback_api_key: ${{ secrets.LITELLM_API_KEY }}
          ai_max_tokens: "32768"
          review_routing_mode: auto
          ai_smart_base_url: ${{ vars.LITELLM_URL }}
          ai_smart_api_format: ${{ vars.SMART_FORMAT }}
          ai_smart_model: ${{ vars.SMART_MODEL }}
          ai_smart_api_key: ${{ secrets.LITELLM_API_KEY }}
          context_limit_mode: normal
          ci_status_check: "true"
          ci_timeout_sec: "600"
          deep_review: "true"
          tool_mode: native_loop
          tool_max_rounds: "4"
          primary_tool_max_requests: "16"
          tool_loop_wall_clock_sec: "600"
          tool_turn_timeout_sec: "300"
          tool_max_tokens_per_turn: "16000"
          tool_max_response_bytes: "12000"
          tool_allowed_gh_api_repos: misospace/pr-reviewer-action
          tool_request_timeout_sec: "15"
          tool_enable_for_forks: "false"
          on_model_failure: notice
          inline_findings: "true"
          verdict_policy: findings_severity_gated
          non_blocking_finding_categories: tests,docs,style,question
          publish_mode: review_verdict
          allow_approve: "true"

      - name: Build v3 runtime (shadow)
        # The #809 shadow comparison: build the v3 TypeScript runtime from
        # the same checkout the v2 review just ran from, then re-run the
        # review through the v3 entry beside v2. Dogfood only — nothing here
        # publishes, and a shadow failure never fails the job.
        if: github.event_name == 'pull_request' && steps.review.outputs.should_review == 'true'
        run: |
          cd "$GITHUB_WORKSPACE"
          npm ci --no-audit --no-fund
          npm run build

      - name: Run v3 shadow review (never publishes)
        if: github.event_name == 'pull_request' && steps.review.outputs.should_review == 'true'
        env:
          # The v2 production run already consumed the shared env file; the
          # shadow rebuilds its bindings from the same workflow sources.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AI_BASE_URL: ${{ vars.LITELLM_URL }}
          AI_API_FORMAT: ${{ vars.PRIMARY_FORMAT }}
          AI_MODEL: ${{ vars.PRIMARY_MODEL }}
          AI_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          AI_MAX_TOKENS: "32768"
          AI_RESPONSE_FORMAT: json_object
          AI_FALLBACK_BASE_URL: ${{ vars.LITELLM_URL }}
          AI_FALLBACK_API_FORMAT: ${{ vars.FALLBACK_FORMAT }}
          AI_FALLBACK_MODEL: ${{ vars.FALLBACK_MODEL }}
          AI_FALLBACK_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          AI_PRIMARY_RETRIES: "3"
          AI_PRIMARY_RETRY_DELAY_SEC: "15"
          REVIEW_ROUTING_MODE: auto
          AI_SMART_BASE_URL: ${{ vars.LITELLM_URL }}
          AI_SMART_API_FORMAT: ${{ vars.SMART_FORMAT }}
          AI_SMART_MODEL: ${{ vars.SMART_MODEL }}
          AI_SMART_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          CONTEXT_LIMIT_MODE: normal
          CI_STATUS_CHECK: "true"
          CI_TIMEOUT_SEC: "600"
          DEEP_REVIEW: "true"
          TOOL_MODE: native_loop
          TOOL_MAX_ROUNDS: "4"
          PRIMARY_TOOL_MAX_REQUESTS: "16"
          TOOL_LOOP_WALL_CLOCK_SEC: "600"
          TOOL_TURN_TIMEOUT_SEC: "300"
          TOOL_MAX_TOKENS_PER_TURN: "16000"
          TOOL_MAX_RESPONSE_BYTES: "12000"
          TOOL_ALLOWED_GH_API_REPOS: misospace/pr-reviewer-action
          TOOL_REQUEST_TIMEOUT_SEC: "15"
          TOOL_ENABLE_FOR_FORKS: "false"
          ON_MODEL_FAILURE: notice
          VERDICT_POLICY: findings_severity_gated
          NON_BLOCKING_FINDING_CATEGORIES: tests,docs,style,question
        run: |
          cd "$GITHUB_WORKSPACE"
          SHADOW_DIR="$(mktemp -d "$RUNNER_TEMP/v3-shadow.XXXXXX")"
          echo "$SHADOW_DIR" > "$RUNNER_TEMP/v3-shadow-dir"
          PR_REVIEWER_RUN_DIR="$SHADOW_DIR" node scripts/v3_shadow_run.mjs run

      - name: Compare v3 shadow against v2
        if: github.event_name == 'pull_request' && steps.review.outputs.should_review == 'true'
        env:
          SHADOW_V2_VERDICT: ${{ steps.review.outputs.verdict }}
          SHADOW_V2_VERDICT_SOURCE: ${{ steps.review.outputs.verdict_source }}
          SHADOW_V2_REVIEW_ROUTE: ${{ steps.review.outputs.review_route }}
          SHADOW_V2_ESCALATION_REASON: ${{ steps.review.outputs.escalation_reason }}
          SHADOW_V2_REQUIRED_CHECKS: ${{ steps.review.outputs.required_checks }}
          SHADOW_V2_ANALYSIS_ENGINE: ${{ steps.review.outputs.analysis_engine }}
          SHADOW_V2_CACHE_HIT_RATIO: ${{ steps.review.outputs.cache_hit_ratio }}
          SHADOW_V2_FINDINGS: ${{ steps.review.outputs.findings }}
        run: |
          cd "$GITHUB_WORKSPACE"
          SHADOW_DIR="$(cat "$RUNNER_TEMP/v3-shadow-dir")"
          PR_REVIEWER_RUN_DIR="$SHADOW_DIR" SHADOW_REPORT="$SHADOW_DIR/shadow-comparison.md" node scripts/v3_shadow_run.mjs compare

      - name: Upload v3 shadow run
        if: github.event_name == 'pull_request' && steps.review.outputs.should_review == 'true'
        run: |
          SHADOW_DIR="$(cat "$RUNNER_TEMP/v3-shadow-dir")"
          mkdir -p "$RUNNER_TEMP/v3-shadow-artifacts"
          cp "$SHADOW_DIR/shadow-comparison.md" "$RUNNER_TEMP/v3-shadow-artifacts/" 2>/dev/null || true
          cp "$SHADOW_DIR/shadow-outputs.txt" "$RUNNER_TEMP/v3-shadow-artifacts/" 2>/dev/null || true
          cp "$SHADOW_DIR/ai-output.json" "$RUNNER_TEMP/v3-shadow-artifacts/" 2>/dev/null || true
          cp "$SHADOW_DIR/tool-harness.json" "$RUNNER_TEMP/v3-shadow-artifacts/" 2>/dev/null || true
          cp "$SHADOW_DIR/review-corpus.truncated.md" "$RUNNER_TEMP/v3-shadow-artifacts/" 2>/dev/null || true
          tar -czf "$RUNNER_TEMP/v3-shadow-artifacts/run.tar.gz" -C "$SHADOW_DIR" . 2>/dev/null || true
          echo "shadow run directory: $SHADOW_DIR"
          echo "shadow comparison:" && cat "$RUNNER_TEMP/v3-shadow-artifacts/shadow-comparison.md" 2>/dev/null || true
