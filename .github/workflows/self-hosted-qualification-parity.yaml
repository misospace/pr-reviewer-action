name: Self-hosted qualification (engine parity)

# #1484: the engine-parity family of the self-hosted qualification
# harness. Its model calls reach a harness-owned stub model server, and
# its forge is the disposable instance the harness starts, so it needs
# no credential. This workflow holds no secret and reads no repository
# secret, so an operator can dispatch it against any ref, a branch that
# carries an open pull request included, and the harness code at that
# ref receives nothing sensitive.
#
# The credentialed qualification workflow (self-hosted-qualification.yaml)
# is a separate file on purpose. GitHub takes the workflow file from the
# dispatched ref, so a workflow that binds a secret must never be
# dispatched from an unreviewed ref.
#
# The job lives in its own workflow because the unprivileged pull_request
# CI must stay secret-free
# (tests/test_fork_review_workflow.py::test_normal_ci_does_not_gain_privileges).
#
# GitHub dispatches only a workflow file that exists on the default
# branch, so this workflow becomes dispatchable once it lands there.
# Before that, the same family runs locally through the
# `make self-hosted-qualification-parity` target.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-hosted-qualification-parity:
    runs-on: ubuntu-latest
    # The harness starts containers. It must not hold a runner for hours.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The dispatched ref's head: this job qualifies the ref it was
          # dispatched on, not the default branch.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: package-lock.json

      # The harness drives the built v3 runtime bundle. dist/ is not
      # committed, so the job builds it before the harness runs.
      - name: Build the v3 runtime bundle
        run: |
          npm ci
          npm run build

      # A missing harness must fail loudly, so a green run can never mean
      # a qualification that did not run.
      - name: Require the harness script
        run: |
          set -euo pipefail
          if [[ ! -f tests/self_hosted_e2e_qualification.sh ]]; then
            echo "::error::The self-hosted qualification harness (tests/self_hosted_e2e_qualification.sh) is absent from this checkout. The job fails instead of reporting a qualification that did not run."
            exit 1
          fi

      # The run is the final step: its exit status reports the
      # qualification pass/fail. No credential is bound to this step, and
      # the harness's parity family reads none.
      - name: Run the engine-parity qualification
        env:
          SELF_HOSTED_QUALIFICATION: "true"
          SELF_HOSTED_QUALIFICATION_FAMILY: "parity"
        run: bash tests/self_hosted_e2e_qualification.sh
