name: Eval Harness

# Runs scripts/eval_harness.py against evals/corpus-agentic.json so that
# review-quality regressions (routing, prompt drift, tool-loop behavior)
# surface before they ship. The harness itself lives in
# scripts/eval_harness.py; this workflow only wires it into CI.
#
# Acceptance reference: issue #472.

on:
  workflow_dispatch:
    inputs:
      corpus:
        description: "Path to the evaluation corpus JSON"
        required: false
        default: "evals/corpus-agentic.json"
        type: string
      modes:
        description: "Space-separated review modes (default 'tools_off native_loop')"
        required: false
        default: "tools_off native_loop"
        type: string
      runs-per-mode:
        description: "Number of runs per mode"
        required: false
        default: "10"
        type: string
      max-prs:
        description: "Maximum PRs to evaluate (blank = corpus default)"
        required: false
        default: ""
        type: string
      # Deep-review specialist A/B (issue #610): 'false' keeps the run
      # standard-only (the scheduled sweep default), 'true' runs the deep
      # specialist phase only, 'both' runs standard and deep for each mode.
      deep:
        description: "Deep-review specialist A/B: false, true, or both"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
          - "both"
  schedule:
    # Weekly Monday 06:00 UTC regression sweep on main.
    - cron: "0 6 * * 1"

# Don't cancel an in-flight eval run; these are infrequent and we want
# every artifact to complete so we can compare across weeks.
concurrency:
  group: eval-harness
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  run-eval-harness:
    name: Run eval harness
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          # Pinned to 3.14 to match CI — a version skew between local and CI is
          # how the duplicate-key regression test first shipped broken (passed on
          # local 3.9, ModuleNotFoundError on CI 3.x).
          python-version: '3.14'

      - name: Run eval harness
        env:
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          CORPUS="${{ inputs.corpus || 'evals/corpus-agentic.json' }}"
          MODES="${{ inputs.modes || 'tools_off native_loop' }}"
          RUNS_PER_MODE="${{ inputs.runs-per-mode || 10 }}"
          MAX_PRS="${{ inputs.max-prs || '' }}"
          # 'false' when the input is absent (the scheduled sweep) so the
          # weekly run stays standard-only (issue #610).
          DEEP="${{ inputs.deep || 'false' }}"

          OUT_DIR="eval-report"
          mkdir -p "$OUT_DIR"

          # Split space-separated MODES into a bash array so we can pass each
          # mode as its own argv element without triggering shellcheck SC2206
          # (word-splitting inside an unquoted array element).
          IFS=' ' read -ra MODES_ARR <<<"$MODES"

          CMD=(python scripts/eval_harness.py --corpus "$CORPUS" --modes "${MODES_ARR[@]}" \
               --model "${AI_MODEL}" --base-url "${AI_BASE_URL}" --api-key "${AI_API_KEY}" \
               --github-token "${GITHUB_TOKEN}")
          if [ -n "$MAX_PRS" ]; then
            CMD+=(--max-prs "$MAX_PRS")
          fi
          CMD+=(--runs-per-mode "$RUNS_PER_MODE" --deep-review "$DEEP" \
                --output "$OUT_DIR/eval-report.json")

          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

      - name: Upload eval-report.json
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eval-report
          path: eval-report/eval-report.json
          if-no-files-found: warn

      - name: Summarize weekly run
        # '!cancelled()' (not always()) so the summary still writes its step
        # summary and #472 tracking comment — then fails via the
        # all-runs-errored guard in scripts/eval_weekly_summary.py — when the
        # harness step exited nonzero on an all-errored sweep (issue #711).
        # Cancelled runs skip it, and the schedule gate keeps manual dispatch
        # runs summary-free.
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_PATH: eval-report/eval-report.json
        run: |
          set -euo pipefail
          # The renderer reads per-mode pass rates from the canonical
          # report["mode_summary"] shape the harness emits (#715), appends
          # the summary to GITHUB_STEP_SUMMARY, posts the #472 tracking
          # comment best-effort, and exits 1 after both are written when
          # every harness run errored (issue #711). A missing report file
          # is a skip, not a failure.
          python scripts/eval_weekly_summary.py \
            --report "$REPORT_PATH" \
            --post-issue 472