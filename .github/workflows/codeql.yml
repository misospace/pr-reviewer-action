# CodeQL analysis for this repository.
#
# CodeQL adds semantic security analysis on top of the existing CI gates
# (gitleaks, shellcheck, yamllint, actionlint, and pytest) in ci.yaml. The
# static linters cannot see the finding classes this workflow targets — the
# threat model in SECURITY.md: command injection, path traversal, SSRF and
# token handling in the shipped TypeScript runtime (src/: tool executors,
# HTTP/transport, platform adapters).
#
# javascript-typescript covers the shipped runtime. python covers the retained
# repository tooling (scripts/ eval, harvest, fork-gate and judge helpers;
# pr_reviewer/ semantic-eval modules), which is not part of the action.
#
# Bash is intentionally NOT in the matrix: CodeQL ships no bash extractor
# (verified by a failed run of the predecessor PR #622 — the init step
# hard-fails with "Did not recognize the following languages: bash"), so
# shell scripts stay covered by the shellcheck gate in ci.yaml.
name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # Dual-language during the Bash/Python → TypeScript migration (#718).
        # python covers the legacy runtime; javascript-typescript covers the
        # src/ runtime. Drop python only in a separate cleanup once the
        # migration retires it. (bash is not a CodeQL language — see the
        # note at the top of this file.)
        language:
          - python
          - javascript-typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        # Python initialization only matters for the python job; the
        # javascript-typescript job analyses src/ with build-mode: none and
        # needs no interpreter.
        if: matrix.language == 'python'
        with:
          python-version: '3.14'

      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Pin the query suite explicitly: the implicit v4 suite is
          # `default`, not `security-and-quality`, and #621's acceptance
          # requires the full security-and-quality pack.
          queries: security-and-quality
          #
          # The javascript-typescript leg also runs the pack's alert-suppression
          # query (#1788). No standard suite ships a query of kind
          # `alert-suppression`, so without it the `codeql[js/...]`
          # justification comments in src/ (see the no-exclusion note below)
          # are never collected and stay inert in the code scanning view.
          # The query must be added through `packs`, not `queries`: the
          # `queries` input only takes suite names, workspace paths and
          # external-repository references, and a `pack:query.ql` entry there
          # makes `database init` fail with "Specifier for external repository
          # is invalid" (the Analyze (javascript-typescript) failure on this
          # PR's first head). `packs` takes the CLI's `scope/name:path` pack
          # spec — here one query file at the codeql/javascript-queries pack
          # root, downloaded from the CodeQL registry — and pack queries run
          # alongside the pinned suite. A test pins this wiring: see
          # tests-v3/executor-kubernetes.test.ts. The reference carries no
          # `@version` deliberately: the pack ships on the CodeQL release
          # train (and depends on the matching `codeql/javascript-all`), a
          # stale hard pin would drift from action bumps while the query is
          # still evolving upstream, and the float fails LOUD — if the query
          # ever leaves the pack root the spec stops resolving and this leg
          # dies at init, the same mechanism that caught the `queries:`
          # misplacement above. It is the only float: the action is SHA-pinned
          # and the suite name is an explicit pin.
          packs: ${{ matrix.language == 'javascript-typescript' && 'codeql/javascript-queries:AlertSuppression.ql' || '' }}
          # NO analysis-level query exclusion. The `js/file-access-to-http`
          # query ("File data in outbound network request") fires on ONE flow
          # in this repository: the in-cluster Kubernetes API client
          # (`src/executor/kubernetes-api.ts`) sends the pod's own projected
          # service-account token and CA bundle to the kubelet-projected
          # cluster API endpoint. That flow IS the #734 product contract —
          # the endpoint is the cluster's own API and the files are the pod's
          # own projected material — and it is justified in source, directly
          # above both request sinks, with a tagged `codeql[...]` comment.
          #
          # Its alerts are dispositioned AT THE ALERT LEVEL (dismissed as
          # false positives, as on `main`), never by switching the query off
          # for the whole repository: an analysis-level exclusion would
          # silence every file-data-to-request flow introduced anywhere else
          # in the runtime, not just this one (#1773 review).

      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
