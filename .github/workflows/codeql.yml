# CodeQL analysis for this repository.
#
# CodeQL adds semantic security analysis on top of the existing CI gates
# (gitleaks, shellcheck, yamllint, actionlint, and pytest) in ci.yaml. The
# static linters cannot see the finding classes this workflow targets — the
# threat model in SECURITY.md: command injection, path traversal, SSRF and
# token handling in the shipped TypeScript runtime (src/: tool executors,
# HTTP/transport, platform adapters).
#
# javascript-typescript covers the shipped runtime. python covers the retained
# repository tooling (scripts/ eval, harvest, fork-gate and judge helpers;
# pr_reviewer/ semantic-eval modules), which is not part of the action.
#
# Bash is intentionally NOT in the matrix: CodeQL ships no bash extractor
# (verified by a failed run of the predecessor PR #622 — the init step
# hard-fails with "Did not recognize the following languages: bash"), so
# shell scripts stay covered by the shellcheck gate in ci.yaml.
name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # Dual-language during the Bash/Python → TypeScript migration (#718).
        # python covers the legacy runtime; javascript-typescript covers the
        # src/ runtime. Drop python only in a separate cleanup once the
        # migration retires it. (bash is not a CodeQL language — see the
        # note at the top of this file.)
        language:
          - python
          - javascript-typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        # Python initialization only matters for the python job; the
        # javascript-typescript job analyses src/ with build-mode: none and
        # needs no interpreter.
        if: matrix.language == 'python'
        with:
          python-version: '3.14'

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Pin the query suite explicitly: the implicit v4 suite is
          # `default`, not `security-and-quality`, and #621's acceptance
          # requires the full security-and-quality pack.
          queries: security-and-quality

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
