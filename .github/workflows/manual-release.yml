name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example 2.0.2 or v2.0.2)'
        required: true
        type: string

concurrency:
  group: manual-release
  cancel-in-progress: false

jobs:
  publish-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Normalize release metadata
        id: release
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${RAW_VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $RAW_VERSION"
            exit 1
          fi
          # Any suffix beyond X.Y.Z (rc, hotfix, …) is a pre-release: it must
          # never advance the floating major tag that @vX consumers track.
          PRERELEASE=true
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            PRERELEASE=false
          fi
          {
            echo "tag=v$VERSION"
            echo "major_tag=v${VERSION%%.*}"
            echo "sha=$(git rev-parse HEAD)"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      # dist/ is not committed to main: the tag points at a build commit whose
      # parent is the released main commit. A stable release also moves the
      # floating major tag; a pre-release never does.
      - name: Create version tag with dist
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SHA: ${{ steps.release.outputs.sha }}
          TAG: ${{ steps.release.outputs.tag }}
          MAJOR_TAG: ${{ steps.release.outputs.major_tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          if EXISTING_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null); then
            PARENT=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$EXISTING_SHA" --jq '.parents[0].sha // ""')
            if [ "$EXISTING_SHA" != "$SHA" ] && [ "$PARENT" != "$SHA" ]; then
              echo "Tag $TAG already points to $EXISTING_SHA"
              exit 1
            fi
          fi
          [ "$PRERELEASE" = "true" ] && MAJOR_TAG=""
          scripts/release/tag-with-dist.sh "$SHA" "$TAG" "$MAJOR_TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.release.outputs.tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            EXTRA_ARGS=()
            [ "$PRERELEASE" = "true" ] && EXTRA_ARGS+=(--prerelease)
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes "${EXTRA_ARGS[@]}"
          fi
