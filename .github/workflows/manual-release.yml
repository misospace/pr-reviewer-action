name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example 2.0.2 or v2.0.2)'
        required: true
        type: string

concurrency:
  group: manual-release
  cancel-in-progress: false

jobs:
  build-dist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - name: Checkout protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Record release commit
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify manifest version matches the requested release
        # #915: the release stamp comes from .release-please-manifest.json, so
        # an inputs.version that disagrees with the manifest would tag vX.Y.Z
        # while stamping vA.B.C into every published review — fail closed.
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${RAW_VERSION#v}"
          MANIFEST=$(jq -r '."."' .release-please-manifest.json)
          if [ "$VERSION" != "$MANIFEST" ]; then
            echo "inputs.version ($VERSION) does not match .release-please-manifest.json ($MANIFEST)."
            echo "Merge the release-please PR that bumps the manifest, or fix the dispatch input."
            exit 1
          fi

      - name: Build
        env:
          # #915: stamp vX.Y.Z from the manifest into the release bundle.
          PR_REVIEWER_BUILD_STAMP: release
        run: npm ci --no-audit --no-fund && npm run build

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-dist
          path: dist/index.js
          if-no-files-found: error

  # Holds the tag-writing token but runs no npm.
  publish-release:
    needs: build-dist
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout the built commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build-dist.outputs.sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist

      - name: Normalize release metadata
        id: release
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${RAW_VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $RAW_VERSION"
            exit 1
          fi
          # Any suffix beyond X.Y.Z (rc, hotfix, …) is a pre-release: it must
          # never advance the floating major tag that @vX consumers track.
          PRERELEASE=true
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            PRERELEASE=false
          fi
          {
            echo "tag=v$VERSION"
            echo "major_tag=v${VERSION%%.*}"
            echo "sha=$(git rev-parse HEAD)"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      # tag-with-dist.sh smokes the build before publishing; run it on the
      # Node the action declares (runs.using: node24).
      - name: Set up Node 24 for the release smoke
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # dist/ is not committed to main: the tag points at a build commit whose
      # parent is the released main commit. A stable release also moves the
      # floating major tag; a pre-release never does.
      - name: Create version tag with dist
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SHA: ${{ steps.release.outputs.sha }}
          TAG: ${{ steps.release.outputs.tag }}
          MAJOR_TAG: ${{ steps.release.outputs.major_tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          if EXISTING_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null); then
            PARENT=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$EXISTING_SHA" --jq '.parents[0].sha // ""')
            if [ "$EXISTING_SHA" != "$SHA" ] && [ "$PARENT" != "$SHA" ]; then
              echo "Tag $TAG already points to $EXISTING_SHA"
              exit 1
            fi
          fi
          [ "$PRERELEASE" = "true" ] && MAJOR_TAG=""
          scripts/release/tag-with-dist.sh "$SHA" "$TAG" "$MAJOR_TAG"


      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.release.outputs.tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            EXTRA_ARGS=()
            [ "$PRERELEASE" = "true" ] && EXTRA_ARGS+=(--prerelease)
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes "${EXTRA_ARGS[@]}"
          fi
