name: Charts

# Structural gates for the #738 self-hosted packaging: the Helm chart in
# deploy/charts/pr-reviewer renders, lints, and its rendered output is
# kubeconform-clean for both example postures. dist/ is never committed,
# so this job builds nothing — it validates the chart contract only.
on:
  pull_request:
    paths:
      - "deploy/**"
      - ".github/workflows/charts.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-charts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      - name: Build chart dependencies
        # Chart.lock and vendored charts/ are deliberately not committed
        # (see the chart README); CI resolves the pinned dependency.
        run: helm dependency build deploy/charts/pr-reviewer

      - name: Lint (controller-only example)
        run: helm lint deploy/charts/pr-reviewer -f deploy/charts/pr-reviewer/examples/values-controller-only.yaml

      - name: Lint (kubernetes-executor example)
        run: helm lint deploy/charts/pr-reviewer -f deploy/charts/pr-reviewer/examples/values-kubernetes-executor.yaml

      - name: Render (controller-only example)
        run: |
          set -euo pipefail
          helm template pr-reviewer deploy/charts/pr-reviewer \
            -f deploy/charts/pr-reviewer/examples/values-controller-only.yaml \
            > /var/tmp/render-controller-only.yaml
          # Structural assertions: the hardened defaults must actually render.
          grep -q "kind: Deployment" /var/tmp/render-controller-only.yaml
          grep -q "runAsNonRoot: true" /var/tmp/render-controller-only.yaml
          grep -q "readOnlyRootFilesystem: true" /var/tmp/render-controller-only.yaml
          grep -q "drop:" /var/tmp/render-controller-only.yaml
          grep -q -- "- ALL" /var/tmp/render-controller-only.yaml
          grep -q "type: RuntimeDefault" /var/tmp/render-controller-only.yaml
          grep -q "automountServiceAccountToken: false" /var/tmp/render-controller-only.yaml
          if grep -q 'name: PR_REVIEWER_KUBERNETES_DEPLOYMENT_DEFAULTS' /var/tmp/render-controller-only.yaml; then
            echo "Kubernetes deployment defaults must be absent outside Kubernetes mode" >&2
            exit 1
          fi
          # #1712: controller-only mode keeps the default-deny token posture
          # on the controller Deployment itself.
          if awk '/^kind: Deployment$/,0' /var/tmp/render-controller-only.yaml | grep -q "automountServiceAccountToken: true"; then
            echo "controller Deployment must keep automountServiceAccountToken: false in controller-only mode" >&2
            exit 1
          fi
          # #1737: controller-only installs hit the same fresh-claim refusal
          # (fsGroup 0775 root, or uid 0 on a bare claim), so fix-roots must
          # render here too — with the controller-only shape: mode 0750 (no
          # setgid, since no second uid writes below these roots), owner uid
          # 1000, group 65532.
          awk '/^kind: Deployment$/,0' /var/tmp/render-controller-only.yaml | grep -q "name: fix-roots"
          awk '/^kind: Deployment$/,0' /var/tmp/render-controller-only.yaml \
            | tr '\n' ' ' | tr -s ' ' | grep -Eq 'chown 1000:65532 .* && chmod 0750 '
          if awk '/^kind: Deployment$/,0' /var/tmp/render-controller-only.yaml \
            | tr '\n' ' ' | tr -s ' ' | grep -Eq 'chmod 2750 '; then
            echo "controller-only fix-roots must not carry the Kubernetes-mode setgid root shape" >&2
            exit 1
          fi
          # The fix targets must be mounted on the init container through
          # persistence globalMounts, exactly as in the Kubernetes mode.
          awk '/initContainers:/,/containers:/' /var/tmp/render-controller-only.yaml \
            > /var/tmp/render-controller-only-init-section.yaml
          grep -A1 'mountPath: /var/lib/pr-reviewer/runs' /var/tmp/render-controller-only-init-section.yaml | grep -q 'name: runs'
          grep -A1 'mountPath: /var/lib/pr-reviewer/cache' /var/tmp/render-controller-only-init-section.yaml | grep -q 'name: workspace-cache'
          # Policies are opt-in; verify default renders none, opt-in renders one.
          if grep -q '^kind: NetworkPolicy$' /var/tmp/render-controller-only.yaml; then
            echo "unexpected default NetworkPolicy in controller-only chart" >&2
            exit 1
          fi
          helm template pr-reviewer deploy/charts/pr-reviewer \
            -f deploy/charts/pr-reviewer/examples/values-controller-only.yaml \
            --set networkPolicy.enabled=true > /var/tmp/render-controller-only-netpol.yaml
          [ "$(grep -c '^kind: NetworkPolicy$' /var/tmp/render-controller-only-netpol.yaml)" -eq 1 ]
          # #1621: the operations dashboard stays OFF by default — the flag
          # is genuinely absent, never emitted as an empty value.
          if grep -q "PR_REVIEWER_ADMIN_DASHBOARD" /var/tmp/render-controller-only.yaml; then
            echo "PR_REVIEWER_ADMIN_DASHBOARD must stay unset with default values" >&2
            exit 1
          fi

      - name: Render (dashboard knob #1621)
        run: |
          set -euo pipefail
          helm template pr-reviewer deploy/charts/pr-reviewer \
            -f deploy/charts/pr-reviewer/examples/values-controller-only.yaml \
            --set controller.admin.dashboard=true \
            > /var/tmp/render-dashboard-on.yaml
          # The knob renders the exact ON spelling the controller accepts.
          grep -A1 -- "- name: PR_REVIEWER_ADMIN_DASHBOARD" /var/tmp/render-dashboard-on.yaml \
            | grep -q 'value: "true"'
          # Fail closed: the knob without the admin listener refuses the
          # render instead of silently dropping the setting.
          if helm template pr-reviewer deploy/charts/pr-reviewer \
            -f deploy/charts/pr-reviewer/examples/values-controller-only.yaml \
            --set controller.admin.enabled=false \
            --set controller.admin.dashboard=true >/dev/null 2>&1; then
            echo "controller.admin.dashboard without controller.admin.enabled must refuse the render" >&2
            exit 1
          fi

      - name: Render (admin OIDC auth #1770)
        run: |
          set -euo pipefail
          oidc_example=deploy/charts/pr-reviewer/examples/values-admin-oidc.yaml
          helm lint deploy/charts/pr-reviewer -f "$oidc_example"
          helm template pr-reviewer deploy/charts/pr-reviewer -f "$oidc_example" \
            > /var/tmp/render-admin-oidc.yaml
          # OIDC mode renders the mode, issuer, client id, redirect base,
          # the allowlist env, and the chart-computed session TTL. The env
          # list round-trips through a YAML parse before re-serialization,
          # so plain strings render unquoted (only bool/numeric-looking
          # values carry quotes).
          grep -A1 -- "- name: PR_REVIEWER_ADMIN_AUTH_MODE" /var/tmp/render-admin-oidc.yaml | grep -q 'value: oidc$'
          grep -q 'name: PR_REVIEWER_ADMIN_OIDC_ISSUER' /var/tmp/render-admin-oidc.yaml
          grep -q 'name: PR_REVIEWER_ADMIN_OIDC_CLIENT_ID' /var/tmp/render-admin-oidc.yaml
          grep -q 'name: PR_REVIEWER_ADMIN_OIDC_REDIRECT_BASE' /var/tmp/render-admin-oidc.yaml
          grep -A1 'name: PR_REVIEWER_ADMIN_OIDC_ALLOWED_EMAILS' /var/tmp/render-admin-oidc.yaml | grep -q 'operator@example.test'
          grep -A1 'name: PR_REVIEWER_ADMIN_OIDC_SESSION_TTL_MS' /var/tmp/render-admin-oidc.yaml | grep -q 'value: "28800000"'
          # The client secret travels only through a secretKeyRef naming the
          # operator-provided existing secret, never inline.
          grep -A3 'name: PR_REVIEWER_ADMIN_OIDC_CLIENT_SECRET' /var/tmp/render-admin-oidc.yaml | grep -q 'secretKeyRef:'
          grep -A4 'name: PR_REVIEWER_ADMIN_OIDC_CLIENT_SECRET' /var/tmp/render-admin-oidc.yaml | grep -q 'name: oidc-client'
          grep -A4 'name: PR_REVIEWER_ADMIN_OIDC_CLIENT_SECRET' /var/tmp/render-admin-oidc.yaml | grep -q 'key: client-secret'
          # The example sets no break-glass token: the bearer env must stay
          # absent rather than render an empty value.
          if grep -q 'name: PR_REVIEWER_ADMIN_TOKEN' /var/tmp/render-admin-oidc.yaml; then
            echo "PR_REVIEWER_ADMIN_TOKEN must stay unset when no break-glass token is configured" >&2
            exit 1
          fi
          # Fail closed: OIDC mode without any allowlist, without client
          # secret material, with BOTH secret shapes, or without the
          # dashboard refuses the render.
          for args in \
            '--set-json controller.admin.auth.oidc.allowedEmails=[]' \
            '--set controller.admin.auth.oidc.existingSecret.name=' \
            '--set controller.admin.auth.oidc.clientSecret=inline-secret' \
            '--set controller.admin.dashboard=false'; do
            # Each case is a single flag string; split it into argv
            # deliberately (shellcheck SC2086).
            read -r -a argv <<< "$args"
            if helm template pr-reviewer deploy/charts/pr-reviewer -f "$oidc_example" "${argv[@]}" >/dev/null 2>&1; then
              echo "OIDC render must refuse: $args" >&2
              exit 1
            fi
          done
          # Break-glass: a token alongside OIDC mode renders the bearer env.
          helm template pr-reviewer deploy/charts/pr-reviewer -f "$oidc_example" \
            --set controller.admin.token=break-glass > /var/tmp/render-admin-oidc-token.yaml
          grep -q 'name: PR_REVIEWER_ADMIN_TOKEN' /var/tmp/render-admin-oidc-token.yaml

      - name: Render (polling first, optional webhook)
        run: |
          set -euo pipefail
          example=deploy/charts/pr-reviewer/examples/values-controller-only.yaml
          github_example=deploy/charts/pr-reviewer/examples/values-kubernetes-executor.yaml
          # The Forgejo example supplies trusted repo targets but no opt-in:
          # it must poll every 15m by default.
          grep -A1 'name: PR_REVIEWER_RECONCILE_INTERVAL_MS' /var/tmp/render-controller-only.yaml | grep -q 'value: "900000"'
          grep -A1 'name: PR_REVIEWER_RECONCILE_REPOS' /var/tmp/render-controller-only.yaml | grep -q 'value: example-org/example-repo'
          # No configured targets => no polling, not a chart failure.
          helm template pr-reviewer deploy/charts/pr-reviewer -f "$example" \
            --set-json 'controller.reconcile.repos=[]' > /var/tmp/render-no-targets.yaml
          if grep -q 'name: PR_REVIEWER_RECONCILE_INTERVAL_MS' /var/tmp/render-no-targets.yaml; then
            echo "reconcile env must be absent without trusted repository targets" >&2
            exit 1
          fi
          # Polling works without a webhook listener or its secret.
          helm template pr-reviewer deploy/charts/pr-reviewer -f "$example" \
            --set controller.webhook.enabled=false > /var/tmp/render-poll-only.yaml
          grep -A1 'name: PR_REVIEWER_RECONCILE_INTERVAL_MS' /var/tmp/render-poll-only.yaml | grep -q 'value: "900000"'
          if grep -q 'name: PR_REVIEWER_WEBHOOK_PORT' /var/tmp/render-poll-only.yaml; then
            echo "webhook must be optional when reconciliation is configured" >&2
            exit 1
          fi
          # Custom interval and explicit opt-out.
          helm template pr-reviewer deploy/charts/pr-reviewer -f "$example" \
            --set controller.reconcile.intervalMs=60000 > /var/tmp/render-poll-override.yaml
          grep -A1 'name: PR_REVIEWER_RECONCILE_INTERVAL_MS' /var/tmp/render-poll-override.yaml | grep -q 'value: "60000"'
          helm template pr-reviewer deploy/charts/pr-reviewer -f "$example" \
            --set controller.reconcile.enabled=false > /var/tmp/render-no-poll.yaml
          if grep -q 'name: PR_REVIEWER_RECONCILE_INTERVAL_MS' /var/tmp/render-no-poll.yaml; then
            echo "explicitly disabled reconciliation still rendered" >&2
            exit 1
          fi
          # A configured GitHub target must carry an exact App installation ID.
          if helm template pr-reviewer deploy/charts/pr-reviewer -f "$github_example" \
            --set 'controller.reconcile.repos[0]=owner/name' >/dev/null 2>&1; then
            echo "GitHub polling must require a pinned installation identity" >&2
            exit 1
          fi
          helm template pr-reviewer deploy/charts/pr-reviewer -f "$github_example" \
            --set 'controller.reconcile.repos[0]=owner/name' \
            --set-string controller.reconcile.githubInstallationId=4242 \
            --set controller.webhook.enabled=false > /var/tmp/render-github-poll.yaml
          grep -A1 'name: PR_REVIEWER_RECONCILE_INTERVAL_MS' /var/tmp/render-github-poll.yaml | grep -q 'value: "900000"'
          grep -A1 'name: PR_REVIEWER_GITHUB_APP_INSTALLATION_ID' /var/tmp/render-github-poll.yaml | grep -q 'value: "4242"'
          # #1723: the App installation identity is ALSO the webhook
          # intake's fallback for a delivery that omitted `installation.id`,
          # so a configured id is emitted with polling explicitly disabled.
          # The poll env must stay absent in that render.
          helm template pr-reviewer deploy/charts/pr-reviewer -f "$github_example" \
            --set controller.reconcile.enabled=false \
            --set-string controller.reconcile.githubInstallationId=4242 \
            > /var/tmp/render-github-no-poll.yaml
          if grep -q 'name: PR_REVIEWER_RECONCILE_INTERVAL_MS' /var/tmp/render-github-no-poll.yaml; then
            echo "reconcile interval rendered with polling disabled" >&2
            exit 1
          fi
          if grep -q 'name: PR_REVIEWER_RECONCILE_REPOS' /var/tmp/render-github-no-poll.yaml; then
            echo "reconcile repos rendered with polling disabled" >&2
            exit 1
          fi
          # Direct file read (no producer|grep -q pipeline under pipefail).
          awk '
            /- name: PR_REVIEWER_GITHUB_APP_INSTALLATION_ID/ {
              getline
              if ($0 ~ /value: "4242"/) found = 1
            }
            END { exit found ? 0 : 1 }
          ' /var/tmp/render-github-no-poll.yaml

      - name: Render (kubernetes-executor example)
        run: |
          set -euo pipefail
          helm template pr-reviewer deploy/charts/pr-reviewer \
            -f deploy/charts/pr-reviewer/examples/values-kubernetes-executor.yaml \
            > /var/tmp/render-kubernetes-executor.yaml
          # Chart-owned worker deployment defaults: image follows the
          # release coordinate, and the bounded JSON reaches controller startup.
          app_version="$(awk '/^appVersion:/ {gsub(/"/, "", $2); print $2; exit}' deploy/charts/pr-reviewer/Chart.yaml)"
          grep -q 'name: PR_REVIEWER_KUBERNETES_DEPLOYMENT_DEFAULTS' /var/tmp/render-kubernetes-executor.yaml
          grep -q "ghcr.io/misospace/pr-reviewer-worker:$app_version" /var/tmp/render-kubernetes-executor.yaml
          helm template pr-reviewer deploy/charts/pr-reviewer \
            -f deploy/charts/pr-reviewer/examples/values-kubernetes-executor.yaml \
            --set-string workerExecutor.image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            > /var/tmp/render-kubernetes-executor-digest.yaml
          grep -q "ghcr.io/misospace/pr-reviewer-worker:$app_version@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" /var/tmp/render-kubernetes-executor-digest.yaml
          if helm template pr-reviewer deploy/charts/pr-reviewer \
            -f deploy/charts/pr-reviewer/examples/values-kubernetes-executor.yaml \
            --set-string workerExecutor.image.digest=sha256:INVALID >/dev/null 2>&1; then
            echo "invalid worker image digest must fail chart rendering" >&2
            exit 1
          fi
          # Worker-executor provisioning: namespace-scoped RBAC over jobs
          # ONLY (no cluster roles), the worker SA, and the shared claims.
          grep -q "kind: Role$" /var/tmp/render-kubernetes-executor.yaml
          if grep -q "kind: ClusterRole" /var/tmp/render-kubernetes-executor.yaml; then
            echo "forbidden kind: ClusterRole found in rendered output" >&2
            exit 1
          fi
          grep -q 'resources: \["jobs"\]' /var/tmp/render-kubernetes-executor.yaml
          grep -q "verbs: \[\"create\", \"get\", \"list\", \"delete\"\]" /var/tmp/render-kubernetes-executor.yaml
          grep -q "automountServiceAccountToken: false" /var/tmp/render-kubernetes-executor.yaml
          # #1712: the Kubernetes executor's controller pod must project its
          # service-account token (bjw-s common 5.x reads pod-level
          # overrides from controllers.<name>.pod — the v1 `podOptions`
          # key is silently ignored, leaving the default-deny false).
          awk '/^kind: Deployment$/,0' /var/tmp/render-kubernetes-executor.yaml | grep -q "automountServiceAccountToken: true"
          grep -q "kind: PersistentVolumeClaim" /var/tmp/render-kubernetes-executor.yaml
          # #1725: Kubernetes-executor mode must render the chart-owned
          # fix-roots init container — kubelet provisions claim roots as
          # group-writable 0775 uid 0, which the runtime's cache-root trust
          # check refuses, so the chart must fix them to 2750 1000:65532
          # before the controller starts. The setgid bit is part of the
          # contract: below-root components inherit group 65532 only from
          # it, and the runtime never chgroups them.
          awk '/^kind: Deployment$/,0' /var/tmp/render-kubernetes-executor.yaml | grep -q "name: fix-roots"
          # tr joins (and squeezes) the folded YAML scalar: the fix command
          # is one long string the emitter wraps across lines.
          awk '/^kind: Deployment$/,0' /var/tmp/render-kubernetes-executor.yaml \
            | tr '\n' ' ' | tr -s ' ' | grep -Eq 'chown 1000:65532 .* && chmod 2750 '
          # #1725 review: the fix-roots chown targets must actually exist in
          # the init container — the common library must render the runs and
          # workspace-cache globalMounts onto fix-roots, not just the app
          # container. Extract only the initContainers section of the
          # Deployment and require both mounts there.
          awk '/initContainers:/,/containers:/' /var/tmp/render-kubernetes-executor.yaml \
            > /var/tmp/render-init-section.yaml
          grep -A1 'mountPath: /var/lib/pr-reviewer/runs' /var/tmp/render-init-section.yaml | grep -q 'name: runs'
          grep -A1 'mountPath: /var/lib/pr-reviewer/cache' /var/tmp/render-init-section.yaml | grep -q 'name: workspace-cache'
          # #1725 review: the fix-roots merge must preserve an
          # operator-defined init container (the common-library map shape
          # keyed by name) alongside the chart-owned one.
          helm template pr-reviewer deploy/charts/pr-reviewer \
            -f deploy/charts/pr-reviewer/examples/values-kubernetes-executor.yaml \
            --set controller.controllers.main.initContainers.operator-init.image.repository=busybox \
            --set controller.controllers.main.initContainers.operator-init.image.tag=latest \
            --set-json 'controller.controllers.main.initContainers.operator-init.command=["echo","ready"]' \
            > /var/tmp/render-operator-init.yaml
          awk '/initContainers:/,/containers:/' /var/tmp/render-operator-init.yaml | grep -q 'name: operator-init'
          awk '/initContainers:/,/containers:/' /var/tmp/render-operator-init.yaml | grep -q 'name: fix-roots'
          # Fail closed: a raw Kubernetes container LIST under
          # controllers.main.initContainers is not the common-library map
          # shape and must refuse the render with the actionable message,
          # not an opaque sprig merge type error.
          if list_err="$(helm template pr-reviewer deploy/charts/pr-reviewer \
            -f deploy/charts/pr-reviewer/examples/values-kubernetes-executor.yaml \
            --set-json 'controller.controllers.main.initContainers=[{"name":"operator-init","image":"busybox:latest"}]' 2>&1 >/dev/null)"; then
            echo "a raw list under controller.controllers.main.initContainers must refuse the render" >&2
            exit 1
          elif ! printf '%s' "$list_err" | grep -q 'map keyed by container name'; then
            echo "list-shaped initContainers must fail with the map-shape guidance, got: $list_err" >&2
            exit 1
          fi
          # Kubernetes-executor mode must also default off; explicit opt-in has two policies.
          if grep -q '^kind: NetworkPolicy$' /var/tmp/render-kubernetes-executor.yaml; then
            echo "unexpected default NetworkPolicy in Kubernetes-executor chart" >&2
            exit 1
          fi
          helm template pr-reviewer deploy/charts/pr-reviewer \
            -f deploy/charts/pr-reviewer/examples/values-kubernetes-executor.yaml \
            --set networkPolicy.enabled=true > /var/tmp/render-kubernetes-executor-netpol.yaml
          # The worker selector is only present when the policy is opted in.
          grep -q 'app.kubernetes.io/managed-by: pr-reviewer-action' /var/tmp/render-kubernetes-executor-netpol.yaml
          policy_count="$(grep -c '^kind: NetworkPolicy$' /var/tmp/render-kubernetes-executor-netpol.yaml || true)"
          if [ "$policy_count" -ne 2 ]; then
            echo "::error::expected 2 opt-in policies for Kubernetes executor; found $policy_count" >&2
            exit 1
          fi
          # #1710: the credential env name must be derived exactly like the
          # runtime's credentialEnvName — upper + [^A-Z0-9] → _ — so the
          # example's hyphenated 'model-key' reference names the variable the
          # controller actually reads, backed by the documented Secret.
          grep -q -- "- name: PR_REVIEWER_CREDENTIAL_MODEL_KEY" /var/tmp/render-kubernetes-executor.yaml
          if grep -q -- "- name: PR_REVIEWER_CREDENTIAL_MODEL-KEY" /var/tmp/render-kubernetes-executor.yaml; then
            echo "::error::credential env name must be sanitized exactly like the runtime's credentialEnvName" >&2
            exit 1
          fi
          grep -A4 -- "- name: PR_REVIEWER_CREDENTIAL_MODEL_KEY" /var/tmp/render-kubernetes-executor.yaml | grep -q 'name: model-credentials'
          grep -A4 -- "- name: PR_REVIEWER_CREDENTIAL_MODEL_KEY" /var/tmp/render-kubernetes-executor.yaml | grep -q 'key: model-key'
          # Property-style references sanitize identically (deliberately
          # many-to-one, like the runtime): 'a-b', 'a.b' and 'a_b' all name
          # PR_REVIEWER_CREDENTIAL_A_B.
          helm template pr-reviewer deploy/charts/pr-reviewer \
            -f deploy/charts/pr-reviewer/examples/values-kubernetes-executor.yaml \
            --set 'controller.credentials.a-b.value=x' \
            --set 'controller.credentials.a\.b.value=y' \
            --set 'controller.credentials.a_b.value=z' \
            > /var/tmp/render-credential-names.yaml
          credential_env_count="$(grep -c -- '- name: PR_REVIEWER_CREDENTIAL_A_B' /var/tmp/render-credential-names.yaml || true)"
          if [ "$credential_env_count" -ne 3 ]; then
            echo "::error::expected 3 credential refs (a-b, a.b, a_b) to sanitize to PR_REVIEWER_CREDENTIAL_A_B; found $credential_env_count" >&2
            exit 1
          fi

      - name: Render (worker model-endpoint egress #1709)
        run: |
          set -euo pipefail
          github_example=deploy/charts/pr-reviewer/examples/values-kubernetes-executor.yaml
          controller_example=deploy/charts/pr-reviewer/examples/values-controller-only.yaml
          worker_egress='[{"to":[{"namespaceSelector":{"matchLabels":{"kubernetes.io/metadata.name":"llm"}},"podSelector":{"matchLabels":{"app.kubernetes.io/name":"litellm"}}}],"ports":[{"protocol":"TCP","port":4000}]}]'
          controller_egress='[{"ports":[{"protocol":"TCP","port":6543}]}]'
          # Bucket rendered documents by policy: the NetworkPolicy whose
          # name carries the -worker / -controller suffix. Kind-scoping
          # is required: the worker ServiceAccount shares the -worker
          # name.
          worker_doc() {
            awk 'BEGIN{RS="---"} /kind: NetworkPolicy/ && $0 ~ /name: [-a-z0-9]+-worker/' "$1"
          }
          controller_doc() {
            awk 'BEGIN{RS="---"} /kind: NetworkPolicy/ && $0 ~ /name: [-a-z0-9]+-controller/' "$1"
          }
          # Default opt-in posture: worker keeps DNS + TLS only, no 4000.
          helm template pr-reviewer deploy/charts/pr-reviewer \
            -f "$github_example" \
            --set networkPolicy.enabled=true > /var/tmp/netpol-default.yaml
          worker_default="$(worker_doc /var/tmp/netpol-default.yaml)"
          if printf '%s' "$worker_default" | grep -q "port: 4000"; then
            echo "::error::worker policy allows port 4000 without the override" >&2
            exit 1
          fi
          printf '%s' "$worker_default" | grep -q "port: 443"
          printf '%s' "$worker_default" | grep -q "port: 53"
          # Configured exception: renders TCP 4000 to the selected pods in
          # the WORKER policy only; the controller keeps its own
          # additionalEgress and never sees the worker rule.
          helm template pr-reviewer deploy/charts/pr-reviewer \
            -f "$github_example" \
            --set networkPolicy.enabled=true \
            --set-json "networkPolicy.workerAdditionalEgress=$worker_egress" \
            --set-json "networkPolicy.additionalEgress=$controller_egress" \
            > /var/tmp/netpol-worker-egress.yaml
          worker="$(worker_doc /var/tmp/netpol-worker-egress.yaml)"
          printf '%s' "$worker" | grep -q "port: 4000"
          printf '%s' "$worker" | grep -q 'kubernetes.io/metadata.name: llm'
          printf '%s' "$worker" | grep -q 'app.kubernetes.io/name: litellm'
          if printf '%s' "$worker" | grep -q "port: 6543"; then
            echo "::error::controller additionalEgress leaked into the worker policy" >&2
            exit 1
          fi
          controller="$(controller_doc /var/tmp/netpol-worker-egress.yaml)"
          printf '%s' "$controller" | grep -q "port: 6543"
          if printf '%s' "$controller" | grep -q "port: 4000"; then
            echo "::error::workerAdditionalEgress leaked into the controller policy" >&2
            exit 1
          fi
          if printf '%s' "$controller" | grep -q "litellm"; then
            echo "::error::worker selector labels leaked into the controller policy" >&2
            exit 1
          fi
          # Selector families stay disjoint: exactly the two policies.
          policy_count="$(grep -c '^kind: NetworkPolicy$' /var/tmp/netpol-worker-egress.yaml || true)"
          if [ "$policy_count" -ne 2 ]; then
            echo "::error::expected 2 opt-in policies; found $policy_count" >&2
            exit 1
          fi
          # Fail closed: a worker exception with no rendered worker policy
          # (controller-only deployment, or the policy disabled) refuses
          # with the guard's own message, not any unrelated breakage.
          refusal="$(helm template pr-reviewer deploy/charts/pr-reviewer \
            -f "$controller_example" \
            --set networkPolicy.enabled=true \
            --set-json "networkPolicy.workerAdditionalEgress=$worker_egress" 2>&1 >/dev/null || true)"
          if ! printf '%s' "$refusal" | grep -q "workerAdditionalEgress requires"; then
            echo "::error::workerAdditionalEgress without a kubernetes worker executor must refuse the render with the guard message" >&2
            exit 1
          fi
          refusal="$(helm template pr-reviewer deploy/charts/pr-reviewer \
            -f "$github_example" \
            --set networkPolicy.enabled=false \
            --set-json "networkPolicy.workerAdditionalEgress=$worker_egress" 2>&1 >/dev/null || true)"
          if ! printf '%s' "$refusal" | grep -q "workerAdditionalEgress requires"; then
            echo "::error::workerAdditionalEgress with networkPolicy disabled must refuse the render with the guard message" >&2
            exit 1
          fi

      - name: Render (standard mode #1768)
        run: |
          set -euo pipefail
          chart=deploy/charts/pr-reviewer
          base=$chart/examples/values-kubernetes-executor.yaml
          standard=$chart/examples/values-standard.yaml
          helm lint "$chart" -f "$base" -f "$standard"
          helm template pr-reviewer "$chart" -f "$base" -f "$standard" > /var/tmp/render-standard.yaml
          awk 'BEGIN{RS="---"} /kind: Service/ && $0 !~ /ServiceAccount/ && /name: pr-reviewer-admin/' /var/tmp/render-standard.yaml | grep -q 'port: 8081'
          awk 'BEGIN{RS="---"} /kind: Service/ && $0 !~ /ServiceAccount/ && /name: pr-reviewer-webhook/' /var/tmp/render-standard.yaml | grep -q 'port: 8080'
          grep -q 'kind: HTTPRoute' /var/tmp/render-standard.yaml
          for path in /hook /admin /auth /dashboard; do grep -Fq "value: $path" /var/tmp/render-standard.yaml; done
          grep -Fq 'type: Exact' /var/tmp/render-standard.yaml
          grep -Fq 'targetPort: 8081' /var/tmp/render-standard.yaml
          grep -q 'PR_REVIEWER_ADMIN_DASHBOARD' /var/tmp/render-standard.yaml
          grep -q 'PR_REVIEWER_WEBHOOK_PORT' /var/tmp/render-standard.yaml
          grep -q 'PR_REVIEWER_ADMIN_PORT' /var/tmp/render-standard.yaml
          route_doc() { awk 'BEGIN{RS="---"} /kind: HTTPRoute/' "$1"; }
          route_doc /var/tmp/render-standard.yaml > /var/tmp/render-standard-route.yaml
          # Rule order is contract: specific prefixes first, the Exact '/'
          # dashboard rule LAST (the root swallows nothing before it).
          order="$(grep -F 'value: ' /var/tmp/render-standard-route.yaml | tr -d ' ' | tr '\n' '|')"
          if [ "$order" != "value:/hook|value:/admin|value:/auth|value:/dashboard|value:/|" ]; then
            echo "::error::unexpected HTTPRoute rule order: $order" >&2
            exit 1
          fi
          if grep -Eq 'filters:|urlRewrite|/metrics|/healthz' /var/tmp/render-standard-route.yaml; then exit 1; fi
          # Negative cases must fail for their own deterministic guard.
          expect_refusal() {
            fragment=$1; shift
            if output=$(helm template pr-reviewer "$chart" -f "$base" "$@" 2>&1); then
              echo "expected refusal: $fragment" >&2; exit 1
            fi
            printf '%s' "$output" | grep -Fq "$fragment"
          }
          expect_refusal 'webhook.enabled conflicts' -f "$standard" --set controller.webhook.enabled=true
          expect_refusal 'dashboard.enabled conflicts' -f "$standard" --set controller.admin.enabled=true
          # Advanced residue must never silently shadow a standard section.
          # The standard merge overwrites enabled/type/forceRename/ports,
          # so the guards refuse only what the merge cannot remove: extra
          # keys, extra ports, and explicit advanced enablement.
          expect_refusal 'controller.service.webhook.extra-key conflicts with the standard webhook Service derivation' -f "$standard" --set controller.service.webhook.extra-key=x
          expect_refusal 'controller.service.webhook.ports.extra conflicts with the standard webhook Service derivation' -f "$standard" --set controller.service.webhook.ports.extra.port=1
          expect_refusal 'conflicts with the standard dashboard Service derivation' -f "$standard" --set controller.service.admin.enabled=true
          expect_refusal 'controller.webhook.existingSecret.name conflicts' -f "$standard" --set controller.webhook.existingSecret.name=other-secret
          expect_refusal 'controller.admin.token conflicts' -f "$standard" --set controller.admin.token=other-token
          expect_refusal 'serviceMonitor.port must equal the admin listener port' -f "$standard" --set serviceMonitor.port=9999
          expect_refusal 'route.raw requires route.enabled: true' --set-json 'route.raw={"apiVersion":"gateway.networking.k8s.io/v1","kind":"HTTPRoute","metadata":{"name":"raw"}}'
          expect_refusal 'route.hostnames is required' -f "$standard" --set-json route.hostnames=[]
          expect_refusal 'route.parentRefs is required' -f "$standard" --set-json route.parentRefs=[]
          expect_refusal 'route.raw is exclusive' -f "$standard" --set-json 'route.raw={"apiVersion":"gateway.networking.k8s.io/v1","kind":"HTTPRoute","metadata":{"name":"raw"}}'
          expect_refusal 'requires dashboard.enabled or controller.admin.enabled' --set monitoring.serviceMonitor.enabled=true
          expect_refusal 'requires an enabled webhook or dashboard backend' \
            --set route.enabled=true \
            --set-json 'route.hostnames=["pr-reviewer.example.com"]' \
            --set-json 'route.parentRefs=[{"name":"envoy-external","namespace":"network"}]' \
            --set controller.webhook.enabled=false --set controller.service.webhook.enabled=false
          expect_refusal 'requires non-empty apiVersion, kind HTTPRoute' -f "$base" --set route.enabled=true --set-json 'route.raw={"apiVersion":"gateway.networking.k8s.io/v1","metadata":{"name":"raw"}}'
          # The intake path is standard-mode configurable: Gitea/GitLab
          # instances route their canonical path instead of /hook, still as
          # the FIRST rule.
          helm template pr-reviewer "$chart" -f "$base" -f "$standard" \
            --set webhook.path=/webhooks/gitea > /var/tmp/render-standard-gitea.yaml
          gitea_order="$(route_doc /var/tmp/render-standard-gitea.yaml | grep -F 'value: ' | tr -d ' ' | tr '\n' '|')"
          if [ "$gitea_order" != "value:/webhooks/gitea|value:/admin|value:/auth|value:/dashboard|value:/|" ]; then
            echo "::error::unexpected HTTPRoute rule order with webhook.path override: $gitea_order" >&2
            exit 1
          fi
          if route_doc /var/tmp/render-standard-gitea.yaml | grep -Fq 'value: /hook'; then
            echo "::error::webhook.path override must replace the /hook rule" >&2
            exit 1
          fi
          expect_refusal 'collides with the reserved admin surface' -f "$standard" --set webhook.path=/admin
          expect_refusal 'conflicts with the standard dashboard (standard mode derives token auth)' -f "$standard" --set controller.admin.auth.oidc.clientSecret=leftover
          # A listener-port override stays first-class: the derived Service
          # port follows it (the chart's own default Service port must not
          # trip the residue guard).
          helm template pr-reviewer "$chart" -f "$base" -f "$standard" \
            --set controller.webhook.port=9090 > /var/tmp/render-standard-port.yaml
          awk 'BEGIN{RS="---"} /kind: Service/ && /name: pr-reviewer-webhook/' /var/tmp/render-standard-port.yaml | grep -q 'port: 9090'
          grep -A2 'name: PR_REVIEWER_WEBHOOK_PORT' /var/tmp/render-standard-port.yaml | grep -q 'value: "9090"'
          awk 'BEGIN{RS="---"} /kind: Service/ && /name: pr-reviewer-webhook/' /var/tmp/render-standard-port.yaml | grep -q 'targetPort: 9090'
          # The gateway NetworkPolicy allowance is scoped to the route's
          # parentRef namespaces, never any-source (the port also serves
          # the unauthenticated /metrics, /healthz, /readyz endpoints).
          helm template pr-reviewer "$chart" -f "$base" -f "$standard" \
            --set networkPolicy.enabled=true > /var/tmp/render-standard-netpol.yaml
          netpol_doc() { awk 'BEGIN{RS="---"} /kind: NetworkPolicy/ && /-controller/' "$1"; }
          netpol_doc /var/tmp/render-standard-netpol.yaml | grep -q 'kubernetes.io/metadata.name'
          netpol_doc /var/tmp/render-standard-netpol.yaml | grep -Eq '^[[:space:]]*- network[[:space:]]*$'
          # The gateway allowance lists ONLY the parentRef namespaces: with
          # every parentRef carrying a namespace, the release namespace must
          # not appear in the matchExpressions values.
          if netpol_doc /var/tmp/render-standard-netpol.yaml | sed -n '/operator: In/,/^      ports:/p' | grep -Eq '^[[:space:]]*- (default|pr-reviewer)[[:space:]]*$'; then
            echo "::error::gateway allowance must not include the release namespace when every parentRef names one" >&2
            exit 1
          fi
          if ! netpol_doc /var/tmp/render-standard-netpol.yaml | awk '/^  ingress:/{ing=1;next} /^  egress:/{ing=0} ing && /^    - /{if (rule&&p8081&&!from) bad++; rule=1; from=($0~/^    - from:/); p8081=0; next} ing && rule && /port: 8081/{p8081=1} END{if (rule&&p8081&&!from) bad++; exit bad>0}'; then
            echo "::error::an ingress rule exposes the admin port without a from: scope" >&2
            exit 1
          fi
          # Raw passthrough positive path: the complete operator manifest
          # renders verbatim (chart adds nothing).
          helm template pr-reviewer "$chart" -f "$base" \
            --set route.enabled=true \
            --set-json 'route.raw={"apiVersion":"gateway.networking.k8s.io/v1","kind":"HTTPRoute","metadata":{"name":"byo-route"},"spec":{"parentRefs":[{"name":"envoy-external","namespace":"network"}],"rules":[{"matches":[{"path":{"type":"PathPrefix","value":"/webhooks/forgejo"}}],"backendRefs":[{"name":"pr-reviewer","port":8080}]}]}}' \
            > /var/tmp/render-raw-route.yaml
          route_doc /var/tmp/render-raw-route.yaml | grep -q 'name: byo-route'
          route_doc /var/tmp/render-raw-route.yaml | grep -q 'backendRefs:'
          if route_doc /var/tmp/render-raw-route.yaml | grep -q 'app.kubernetes.io/managed-by'; then
            echo "::error::route.raw must render verbatim without injected chart labels" >&2
            exit 1
          fi

      - name: kubeconform rendered output
        # kubeconform ships no maintained GitHub action; run the pinned
        # release binary with its CHECKSUMS-verified tarball instead.
        run: |
          set -euo pipefail
          version=v0.8.0
          checksum=9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
          cd "$(mktemp -d)"
          curl -sSLo kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${version}/kubeconform-linux-amd64.tar.gz"
          echo "${checksum}  kubeconform.tar.gz" | sha256sum --check --strict
          tar -xzf kubeconform.tar.gz kubeconform
          ./kubeconform -strict -skip ServiceMonitor,HTTPRoute \
            -summary /var/tmp/render-controller-only.yaml
          ./kubeconform -strict -skip ServiceMonitor,HTTPRoute \
            -summary /var/tmp/render-kubernetes-executor.yaml
          ./kubeconform -strict -skip ServiceMonitor,HTTPRoute \
            -summary /var/tmp/render-standard.yaml
