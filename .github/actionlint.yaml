# The action ships dist/ only on release tags (#787). The dogfood and fork
# workflows build it in a step before `uses: ./`, so actionlint's static
# check of the local action's `main` file cannot see it. Scope the ignore to
# exactly that message in the two workflows that use the local action.
paths:
  .github/workflows/ai-pr-review.yaml:
    ignore:
      - 'file "dist/index\.js" does not exist in "[^"]*"\. it is specified at "main" key in "runs" section'
  .github/workflows/fork-ai-review.yaml:
    ignore:
      - 'file "dist/index\.js" does not exist in "[^"]*"\. it is specified at "main" key in "runs" section'
