# Admission guardrails for per-run worker credential Secrets (#1423).
#
# Rejects any Secret claiming the pr-reviewer-action identity, using the
# deterministic prv-cred- name prefix, or written by one of the operator's
# controller identities, unless it is shaped as the executor's per-run
# credential Secret: Opaque, named prv-cred- + 24 hex chars of the run id,
# carrying the hashed identity labels, with credential-name keys only.
#
# Text is pinned to src/executor/admission-policy.ts by
# tests-v3/executor-admission-policy.test.ts. Helm delivery is #738.
# Requires Kubernetes v1.30 or later (params in the match condition).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pr-reviewer-worker-secret
spec:
  failurePolicy: Fail
  sideEffects: None
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - secrets
  matchConditions:
    - name: pr-reviewer-controller-or-identity
      expression: has(object.metadata.labels) && 'app.kubernetes.io/managed-by' in object.metadata.labels && object.metadata.labels['app.kubernetes.io/managed-by'] == 'pr-reviewer-action' || object.metadata.name.startsWith('prv-cred-') || has(params.data.controllerUsernames) && params.data.controllerUsernames.split(',').exists(u, u.trim() == request.userInfo.username)
  validations:
    - expression: object.metadata.name.matches('^prv-cred-[0-9a-f]{24}$')
      message: credential Secrets must be named as per-run executor Secrets ('prv-cred-' + 24 hex chars of the run id)
    - expression: object.type == 'Opaque'
      message: per-run credential Secrets must be Opaque
    - expression: object.metadata.labels['app.kubernetes.io/managed-by'] == 'pr-reviewer-action' && ['pr-reviewer.io/job-hash', 'pr-reviewer.io/run-hash'].all(k, k in object.metadata.labels)
      message: credential Secrets must carry the app.kubernetes.io/managed-by=pr-reviewer-action identity plus the pr-reviewer.io/job-hash/pr-reviewer.io/run-hash correlation labels
    - expression: has(object.data) && object.data.size() > 0 && object.data.keys().all(k, k.matches('^[a-z][a-z0-9-]{0,63}$')) && (!has(object.stringData) || object.stringData.keys().all(k, k.matches('^[a-z][a-z0-9-]{0,63}$')))
      message: credential Secrets must carry at least one data entry and every key must match ^[a-z][a-z0-9-]{0,63}$
    - expression: "!('pr-reviewer.io/run-hash' in object.metadata.labels) || object.metadata.name == 'prv-cred-' + object.metadata.labels['pr-reviewer.io/run-hash'].substring(0, 24)"
      message: a labeled credential Secret must be named for exactly the run its run-hash label carries
---
# The binding activates the policy in the namespaces labeled
# 'pr-reviewer.io/admission: enforce' (the instance-config
# kubernetes.namespace) and DENIES on failure — including a missing
# parameter ConfigMap (parameterNotFoundAction: Deny), so a half-applied
# installation never runs unguarded. The ConfigMap lives in the worker
# namespace; see worker-admission-params.example.yaml.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: pr-reviewer-worker-secret-binding
spec:
  policyName: pr-reviewer-worker-secret
  validationActions:
    - Deny
  paramRef:
    name: pr-reviewer-worker-admission-params
    namespace: review-workers
    parameterNotFoundAction: Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        pr-reviewer.io/admission: enforce
