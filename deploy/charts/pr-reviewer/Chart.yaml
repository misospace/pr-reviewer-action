apiVersion: v2
name: pr-reviewer
description: >
  Self-hosted pr-reviewer-action controller daemon (#1348) and its
  Kubernetes worker-executor provisioning (#734/#738). Deploys the
  controller only — PostgreSQL is always operator-provided, never
  deployed by this chart.
type: application
version: 0.1.0
# The controller protocol/app version the chart is built against, from
# .release-please-manifest.json (the release stamp the bundle carries).
appVersion: "3.8.0"
dependencies:
  - name: common
    repository: https://bjw-s-labs.github.io/helm-charts
    version: 5.3.0
