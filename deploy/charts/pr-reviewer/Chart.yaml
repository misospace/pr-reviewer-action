apiVersion: v2
name: pr-reviewer
description: >
  Self-hosted pr-reviewer-action controller daemon (#1348) and its
  Kubernetes worker-executor provisioning (#734/#738). Deploys the
  controller only — PostgreSQL is always operator-provided, never
  deployed by this chart.
type: application
# #1708: the chart is a first-class release artifact published to
# oci://ghcr.io/misospace/charts/pr-reviewer, and Helm OCI artifacts are
# tagged by Chart.yaml.version — so the chart release coordinates are the
# application release coordinates. `version` and `appVersion` both equal
# the release in .release-please-manifest.json; release-please bumps both
# annotated lines with the manifest (see release-please-config.json
# `extra-files`), and .github/workflows/publish-chart.yaml refuses to
# publish a tag they do not agree with. Independent chart releases would
# be a deliberate separate versioning design, not implicit drift.
version: 3.10.0 # x-release-please-version
appVersion: "3.10.0" # x-release-please-version
annotations:
  artifacthub.io/license: AGPL-3.0-only
dependencies:
  - name: common
    repository: https://bjw-s-labs.github.io/helm-charts
    version: 5.3.0
