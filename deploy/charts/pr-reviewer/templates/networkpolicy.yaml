{{/*
Default-deny network policies (#738). Two policies, one per pod family:

- Controller pods (release namespace): deny-all ingress; egress limited
  to DNS, PostgreSQL (5432), and TLS (443 — the forge API and the model
  endpoints). `networkPolicy.additionalIngress`/`additionalEgress` are
  operator-extensible rule lists appended verbatim. In Kubernetes-
  executor mode the controller also needs the Kubernetes API: the 443
  rule covers the ClusterIP under classic kube-proxy, but Cilium
  kube-proxy-replacement redirects it to the hostNetwork'd API server
  (`nodeIP:6443`) and policy is evaluated against that backend, so KPR
  clusters must add a 6443 exception via `additionalEgress` (#1714 —
  see docs/self-hosted-deployment.md).
- Worker pods (worker namespace): the selector MUST cover every worker
  pod the executor creates — src/executor/kubernetes.ts
  (WORKER_NETWORK_POSTURE.selector) stamps
  `app.kubernetes.io/managed-by: pr-reviewer-action` onto every worker
  pod template. Ingress: deny-all (the worker never serves anything).
  Egress: DNS and TLS only — the worker's request/result travel over the
  shared volumes, never the network. #1709: the worker ALSO calls the
  configured model endpoint directly, so a plain-HTTP (non-TLS) in-cluster
  endpoint needs `networkPolicy.workerAdditionalEgress`, an explicit
  worker-only extension appended verbatim to the worker policy's egress.
  It never touches the controller policy, and `additionalEgress` never
  touches the worker policy.
*/}}
{{/* ONE condition decides whether the worker policy renders; the
  #1709 guard and the worker document must never disagree. */}}
{{- $workerPolicy := and .Values.networkPolicy.enabled
  (eq (dig "mode" "disabled" (.Values.workerExecutor | default dict)) "kubernetes") }}
{{- if and .Values.networkPolicy.workerAdditionalEgress (not $workerPolicy) }}
{{- fail "networkPolicy.workerAdditionalEgress requires networkPolicy.enabled and workerExecutor.mode: kubernetes; without a rendered worker policy the exception would be silently dropped" }}
{{- end }}
{{- $stdWebhook := include "pr-reviewer.std.webhook" . | fromYaml -}}
{{- $stdAdmin := include "pr-reviewer.std.admin" . | fromYaml -}}
{{- $monitorEnabled := or .Values.monitoring.serviceMonitor.enabled .Values.serviceMonitor.enabled -}}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pr-reviewer.resource-fullname" (dict
    "releaseName" .Release.Name
    "chartName" .Chart.Name
    "nameOverride" .Values.controller.nameOverride
    "fullnameOverride" .Values.controller.fullnameOverride) }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "pr-reviewer.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if or $stdWebhook.enabled .Values.controller.webhook.enabled }}
    # The webhook intake must be reachable from the forge's delivery
    # path (typically the cluster ingress controller); any-source by
    # default — narrow it with additionalIngress.
    - ports:
        - protocol: TCP
          port: {{ .Values.controller.webhook.port }}
    {{ end }}
    {{- if and .Values.route.enabled $stdAdmin.enabled (empty (.Values.route.raw | default dict)) }}
    {{- /* The public gateway path must reach the admin Service. Scoped to
           the namespaces the route's parentRefs point at (parentRefs
           without a namespace live in the release namespace) — NOT
           any-source, because this port also serves the UNAUTHENTICATED
           /metrics, /healthz, and /readyz endpoints; /admin/* stays
           bearer-guarded. Widen for hostNetwork gateways (a node-source
           exception) via additionalIngress. A raw route is rendered
           verbatim, so this allowance is never derived for it. */ -}}
    {{- $routeNamespaces := list ( .Release.Namespace | toString ) -}}
    {{- range $parent := .Values.route.parentRefs -}}
    {{- with $parent.namespace -}}{{- $routeNamespaces = append $routeNamespaces (toString .) -}}{{- end -}}
    {{- end -}}
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
{{ $routeNamespaces | uniq | toYaml | indent 18 }}
      ports:
        - protocol: TCP
          port: {{ $stdAdmin.port }}
    {{- end }}
    {{- if $monitorEnabled }}
    # Prometheus scrapes /metrics on the admin port; the admin surface is
    # bearer-token guarded, so namespace-scoped ingress suffices.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.controller.admin.port }}
    {{- end }}
    {{- with .Values.networkPolicy.additionalIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    # DNS resolution (kube-dns/CoreDNS in kube-system).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # PostgreSQL control plane (operator narrows the destination).
    - ports:
        - protocol: TCP
          port: 5432
    # Forge API + model endpoints over TLS.
    - ports:
        - protocol: TCP
          port: 443
    {{- with .Values.networkPolicy.additionalEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- if $workerPolicy }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pr-reviewer.resource-fullname" (dict
    "releaseName" .Release.Name
    "chartName" .Chart.Name
    "nameOverride" .Values.controller.nameOverride
    "fullnameOverride" .Values.controller.fullnameOverride) }}-worker
  namespace: {{ default .Release.Namespace .Values.workerExecutor.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: pr-reviewer-action
  policyTypes:
    # Explicit deny-all ingress: the worker is never a server.
    - Ingress
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
    {{- with .Values.networkPolicy.workerAdditionalEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
