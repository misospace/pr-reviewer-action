name: Miso PR Review
description: Review pull requests with OpenAI- or Anthropic-compatible models and post an optional sticky comment.

inputs:
  github_token:
    description: GitHub token for PR and API access
    required: true
  repo:
    description: Repository in owner/name format. Defaults to the current workflow repository.
    required: false
    default: ""
  pr_number:
    description: Pull request number. Defaults to the current pull_request event number.
    required: false
    default: ""
  ai_base_url:
    description: Base URL of the primary AI API
    required: true
  ai_api_format:
    description: API request/response format for the primary AI endpoint (openai or anthropic)
    required: false
    default: openai
  ai_model:
    description: Model name for the primary analysis pass
    required: true
  ai_api_key:
    description: Optional API key for the primary AI endpoint
    required: false
    default: ""
  ai_max_tokens:
    description: >-
      Maximum completion tokens for the primary and fallback final review calls.
      Default 8192. Reasoning models that emit a thinking channel need this
      headroom — too low a cap is consumed by reasoning, leaving empty content
      with finish_reason=length, so the verdict JSON fails to parse and the
      review needlessly escalates or fails. Raise further (e.g. 16000) for
      verbose reasoning models.
    required: false
    default: "8192"
  ai_temperature:
    description: >-
      Sampling temperature for the review model. Default "0.1". Set to an empty string to
      omit the field entirely (some newer cloud models reject any non-default temperature).
    required: false
    default: "0.1"
  ai_response_format:
    description: >-
      Structured-output mode for OpenAI-compatible endpoints (including LiteLLM): off (default),
      json_object, or json_schema (enforces a verdict/review_markdown schema). Ignored for the
      anthropic format. Improves output reliability with smaller local models. Applies to both
      the primary and fallback review calls.
    required: false
    default: "off"
  ai_tokens_param:
    description: >-
      Token-limit field name for OpenAI-compatible requests: max_tokens (default) or
      max_completion_tokens (required by newer OpenAI reasoning models). Ignored for anthropic.
    required: false
    default: "max_tokens"
  anthropic_version:
    description: Anthropic API version header used when ai_api_format or ai_fallback_api_format is anthropic
    required: false
    default: "2023-06-01"
  ai_fallback_base_url:
    description: Optional base URL of a fallback AI API; defaults to ai_base_url when blank
    required: false
    default: ""
  ai_fallback_api_format:
    description: Fallback API request/response format; defaults to ai_api_format when blank
    required: false
    default: ""
  ai_fallback_model:
    description: Optional model name for the fallback analysis pass
    required: false
    default: ""
  ai_fallback_api_key:
    description: Optional API key for the fallback endpoint; defaults to ai_api_key when blank
    required: false
    default: ""
  ai_primary_retries:
    description: Number of retries for the primary model
    required: false
    default: "8"
  ai_primary_retry_delay_sec:
    description: Delay between primary retries in seconds
    required: false
    default: "15"
  on_model_failure:
    description: >-
      Behavior when both primary and fallback models fail to return a usable review.
      'fail' (default) fails the action step. 'notice' instead posts a visible
      request_changes notice explaining the review could not run (never auto-approves),
      so reviewers see an explanation instead of only a red check.
    required: false
    default: "fail"
  fail_on_request_changes:
    description: >-
      If true, fail the action step when the final verdict is request_changes,
      so the review can act as a CI merge gate without a GitHub App. The gate
      runs after publishing, so the review comment and inline findings still
      land on the PR. It reads the same final verdict the `verdict` output
      reports (post-verdict_policy, post-evidence-blocker and tool-failure
      enforcement), not the raw model verdict. on_model_failure=notice still
      passes: a model outage produces no verdict and must not wedge merges.
      Default false — existing consumers see no behaviour change.
    required: false
    default: "false"
  verdict_policy:
    description: >-
      How the final verdict is decided. 'model' (default) uses the model's own verdict.
      'findings_severity_gated' preserves request_changes from the model and escalates
      approve to request_changes when any blocker-severity finding exists. Non-blocker
      findings never weaken a model rejection. Enforcement settings (evidence blockers,
      tool failure) still apply afterwards and can force request_changes.
    required: false
    default: "model"
  inline_findings:
    description: >-
      If true, structured findings that anchor to a line in the PR diff are attached as
      native line-anchored review comments when publishing with publish_mode=review_comment
      or review_verdict. Findings that cannot be anchored stay in the review body only.
      Default false — no inline comments. Ignored for publish_mode=comment.
    required: false
    default: "false"
  inline_findings_max:
    description: Maximum inline review comments attached per review when inline_findings=true.
    required: false
    default: "20"
  validate_required_checks:
    description: >-
      Whether to validate the final review against the classifier's must_check items.
      'auto' (default) validates whenever must_check is non-empty; 'true' and 'false'
      force it on or off. Since #750, validation is structured-first: when the verdict
      carries required_check_dispositions, each deterministic check must be
      dispositioned satisfied, grounded not_applicable, or unresolved; the legacy
      keyword match applies only when the model emitted no structured dispositions
      at all.
    required: false
    default: "auto"
  required_check_validation_mode:
    description: >-
      What to do when required checks are unresolved or undispositioned. 'warn'
      (default) appends an 'Unaddressed required checks' section to the published
      review. 'fail' also forces a request_changes verdict. 'metadata_only' records
      the result (required_checks output and metadata marker) without changing the
      published review. Incompleteness never triggers smart escalation by itself
      (#721).
    required: false
    default: "warn"
  review_routing_mode:
    description: >-
      Route PR reviews between the primary and smart models based on the
      deterministic classification. 'off' (default) preserves existing
      primary/fallback behavior. 'auto' sends PRs whose pr_kind or risk_flags
      match escalate_on_risk_flags to the smart model (when one is configured)
      and keeps everything else on the primary model.
    required: false
    default: "off"
  ai_primary_model:
    description: Model for the primary review route when review_routing_mode=auto. Defaults to ai_model.
    required: false
    default: ""
  ai_primary_base_url:
    description: Base URL for the primary route model. Defaults to ai_base_url.
    required: false
    default: ""
  ai_primary_api_format:
    description: API format for the primary route model (openai or anthropic). Defaults to ai_api_format.
    required: false
    default: ""
  ai_primary_api_key:
    description: API key for the primary route model. Defaults to ai_api_key.
    required: false
    default: ""
  ai_smart_model:
    description: "Opt-in smarter model for high-risk reviews (review_routing_mode=auto). With no smart model set, auto-routing stays on the primary model and never escalates. After a successful primary review, a smart re-review runs only when the primary reviewer explicitly requests it via the structured smart_review_requested verdict field (#721); heuristic signals (request_changes, low confidence, blockers, incomplete coverage) are telemetry only. The fallback model is NEVER an escalation target — it only catches a primary-availability failure."
    required: false
    default: ""
  ai_smart_base_url:
    description: Base URL for the smart model. Defaults to ai_base_url.
    required: false
    default: ""
  ai_smart_api_format:
    description: API format for the smart model (openai or anthropic). Defaults to ai_api_format.
    required: false
    default: ""
  ai_smart_api_key:
    description: API key for the smart model. Defaults to ai_api_key.
    required: false
    default: ""
  escalate_on_risk_flags:
    description: >-
      Comma-separated pr_kind / risk_flag names that route directly to the smart model
      when review_routing_mode=auto. Matched against route_signals — linked-issue flags
      and file-based signals backed by an actual changed filename — so a benign PR whose
      diff merely mentions a pattern (e.g. os.path) does not route.
    required: false
    default: "linked_security_issue,linked_priority_p0,linked_priority_p1,auth_changes,public_route_changes,file_serving_changes,path_handling_changes,secret_handling_changes,db_or_migration_changes"
  escalate_on_incomplete_required_checks:
    description: "Deprecated since #721: accepted for backward compatibility but no longer triggers escalation — post-primary smart escalation is reviewer-requested only (the primary model's structured smart_review_requested verdict field). The value is ignored except for a startup notice."
    required: false
    default: "false"
  escalate_on_fast_request_changes:
    description: "Deprecated since #721: accepted for backward compatibility but no longer triggers escalation — post-primary smart escalation is reviewer-requested only (the primary model's structured smart_review_requested verdict field). The value is ignored except for a startup notice."
    required: false
    default: "true"
  escalate_on_fast_low_confidence:
    description: "Deprecated since #721: accepted for backward compatibility but no longer triggers escalation — post-primary smart escalation is reviewer-requested only (the primary model's structured smart_review_requested verdict field). The value is ignored except for a startup notice."
    required: false
    default: "true"
  escalate_on_tool_or_evidence_blockers:
    description: >-
      Deprecated since #721: accepted for backward compatibility but no longer triggers
      escalation — post-primary smart escalation is reviewer-requested only (the primary
      model's structured smart_review_requested verdict field). Evidence/tool blockers
      remain subject to deterministic enforcement; the value is ignored except for a
      startup notice.
    required: false
    default: "true"
  escalate_on_tool_planning_failure:
    description: "Deprecated since #721: accepted for backward compatibility but no longer triggers escalation — post-primary smart escalation is reviewer-requested only (the primary model's structured smart_review_requested verdict field). The value is ignored except for a startup notice."
    required: false
    default: "false"
  ai_stream:
    description: If true, use streaming responses to avoid timeouts behind proxies with short read timeouts (e.g. Cloudflare 100s edge timer)
    required: false
    default: "true"
  ai_fallback_stream:
    description: If set, overrides ai_stream for the fallback model; defaults to ai_stream value when blank
    required: false
    default: ""
  allowed_source_hosts:
    description: Comma-separated list of hosts allowed for linked source fetching
    required: false
    default: github.com,api.github.com,gitlab.com,registry.terraform.io,artifacthub.io
  related_code_context:
    description: Include deterministic related-code context discovered from changed-file anchors
    required: false
    default: "true"
  related_code_max_bytes:
    description: Maximum bytes of related-code context included in the review corpus (values below 64 are clamped to 64)
    required: false
    default: "16000"
  linear_api_key:
    description: Optional Linear personal API key used to fetch issue/spec context from PR-title identifiers
    required: false
    default: ""
  linear_issue_prefixes:
    description: Comma-separated Linear team keys recognized in PR titles (for example DST,LAB); empty disables the Linear adapter
    required: false
    default: ""
  linear_issue_timeout_sec:
    description: Timeout in seconds for each Linear GraphQL issue lookup
    required: false
    default: "20"
  linear_enable_for_forks:
    description: If true, allow private Linear issue context to be fetched and included for cross-repository PRs
    required: false
    default: "false"
  system_prompt:
    description: Optional system prompt override. When both this and system_prompt_file are set, the file content is read first and the inline value is appended (separated by two newlines), combining static repo conventions with per-PR steering.
    required: false
    default: ""
  system_prompt_file:
    description: Optional file path in the reviewed repository to use as the system prompt. When both this and system_prompt are set, the file content is read first and the inline system_prompt is appended (separated by two newlines).
    required: false
    default: ""
  system_prompt_mode:
    description: >-
      How a supplied system_prompt / system_prompt_file combines with the bundled
      default. 'replace' (default) uses the supplied prompt verbatim. 'append'
      keeps the conditionally-assembled bundled default and appends the supplied
      prompt as a repo-specific addendum — so consumers add conventions without
      copying (and re-syncing) the whole default.
    required: false
    default: "replace"
  review_verbosity:
    description: >-
      Output-length dial for the bundled default prompt. 'normal' (default)
      leaves the prompt unchanged. 'concise' adds a brevity fragment: a ~300-word
      target, prose limited to blocker/major issues with minor/info left to the
      findings array, no diff restatement, and Standards Compliance omitted unless
      a convention is violated. must_check coverage and the Unknowns section are
      explicitly exempt, so brevity cannot hide a gap. Applies only to the bundled
      default — a replace-mode system_prompt override is used verbatim.
    required: false
    default: "normal"
  standards_file:
    description: Repository standards file path for conventions and policy context
    required: false
    default: ""
  standards_file_candidates:
    description: Candidate files to auto-discover when standards_file is not set. First found is used.
    required: false
    default: AGENTS.md,agents.md,CLAUDE.md,claude.md,.github/ai-review-rules.md,.github/ai-review-rules.txt
  publish_review_comment:
    description: If true, publish or update a PR comment with the generated review
    required: false
    default: "false"
  publish_mode:
    description: >-
      Publish mode for the review verdict. 'comment' publishes a sticky PR comment (default).
      'review_comment' uses GitHub's native PR review API to submit a non-blocking review comment.
      'review_verdict' uses GitHub's native PR review API to submit approve/request_changes.
      Requires permissions: pull-requests: write for review_comment and review_verdict modes.
    required: false
    default: "comment"
  allow_approve:
    description: >-
      If true and publish_mode=review_verdict, the model's approve verdict can be submitted as a
      native approval. Defaults to false — approval is blocked unless explicitly enabled. WARNING:
      native approvals can affect branch protection rules and automerge pipelines.
    required: false
    default: "false"
  approve_forks:
    description: >-
      If true and publish_mode=review_verdict with allow_approve=true, native approvals are also
      allowed for cross-repository (fork) PRs. Defaults to false — fork PRs are blocked from
      approval even when allow_approve is set.
    required: false
    default: "false"
  cleanup_previous_native_reviews:
    description: >-
      Mark previous managed native PR reviews as outdated/superseded before publishing a new
      native review. Accepted values: `auto` (default, enables cleanup for review_comment and
      review_verdict modes), `true`, or `false`. Cleanup only targets reviews created by this
      action and carrying the managed marker. Dismissal of old approval/request-changes reviews
      is attempted when permissions allow but is secondary to visual cleanup.
    required: false
    default: "auto"
  upstream_link_mode:
    description: >-
      How upstream GitHub PR/issue/commit/compare URLs in the published review are handled.
      `inert` (default) rewrites them to plain text so GitHub never auto-links them.
      `togithub` rewrites them to https://togithub.com/... so they stay clickable without
      triggering notifications or cross-repository auto-linking. Shorthand references
      (owner/repo#123, bare #123) are inert in both modes.
    required: false
    default: "inert"
  context_limit_mode:
    description: Context budget mode - normal (140k/70k/220k), low (80k/40k/120k), minimal (40k/20k/60k)
    required: false
    default: normal
  model_context_tokens:
    description: >-
      The model's real context window in tokens (e.g. 8192, 32768). When set,
      corpus/diff/file byte budgets are derived from it (reserving ai_max_tokens
      for output) instead of context_limit_mode — recommended for local models
      whose windows are smaller than the named modes assume. Empty uses
      context_limit_mode.
    required: false
    default: ""
  primary_model_context_tokens:
    description: Primary tier context window in tokens; empty inherits model_context_tokens/context_limit_mode
    required: false
    default: ""
  smart_model_context_tokens:
    description: Smart tier context window in tokens; empty inherits model_context_tokens/context_limit_mode
    required: false
    default: ""
  primary_request_shape:
    description: Primary request layout (default or trailing_task)
    required: false
    default: default
  smart_request_shape:
    description: Smart request layout (default or trailing_task)
    required: false
    default: default
  repo_map_context:
    description: Include a bounded deterministic map of Git-tracked repository structure in the review corpus and native-loop planning context
    required: false
    default: "true"
  repo_map_max_bytes:
    description: Maximum UTF-8 bytes for the repository-map Markdown artifact and planning slot
    required: false
    default: "12000"
  pr_thread_context:
    description: Include bounded recent PR conversation comments (thread context) in the review corpus, with the action's own managed comments filtered out
    required: false
    default: "true"
  pr_thread_max_bytes:
    description: Maximum UTF-8 bytes of PR-thread context in the review corpus (whole comments are dropped to fit; values above 200000 are rejected)
    required: false
    default: "8000"
  review_threads_context:
    description: Include unresolved inline review threads (the action's earlier findings and the replies to them) in the review corpus; the reviewer must disposition each listed thread
    required: false
    default: "true"
  review_threads_max_bytes:
    description: Maximum UTF-8 bytes of review-thread context in the review corpus (whole threads are dropped to fit; values above 200000 are rejected)
    required: false
    default: "8000"

  # Deep review: opt-in specialist leads. 'true' runs all three fixed
  # specialist roles (correctness / security / tests — pr_reviewer/specialists.py)
  # concurrently over the same review corpus, reusing the primary model
  # settings. 'auto' (#633) deterministically selects the roles worth running
  # from the classification data (pr_kind / risk_flags / changed-file classes;
  # no model call) — possibly zero. 'false' disables the phase. Each
  # specialist's structured leads are parsed and normalized (severity capped
  # below a blocker, bounded) and written to specialist-<role>.json +
  # specialists.json. Advisory only in this iteration: the leads never touch
  # the verdict, enforcement, or the published review body; skipped roles are
  # telemetry, not failures.
  deep_review:
    description: 'Specialist leads (correctness/security/tests) over the review corpus: false = off, true = all three roles, auto = deterministic classifier-driven selection, possibly zero (advisory only)'
    required: false
    default: 'false'

  # Deep review phase deadline: maximum wall-clock seconds for the whole
  # specialist phase (all three roles). Roles still running past the deadline
  # are recorded as errors on their specialist-<role>.json / specialists.json;
  # the review is never delayed or failed.
  deep_review_timeout_sec:
    description: 'Maximum wall-clock seconds for the whole deep-review specialist phase; stragglers past the deadline are recorded as role errors (advisory only). Default 600.'
    required: false
    default: '600'

  # #632: independent specialist output budget. Deliberately separate from
  # ai_max_tokens so a narrow advisory scout gets a short structured-JSON
  # allowance instead of the final reviewer's much larger budget.
  deep_review_max_tokens:
    description: 'Maximum completion tokens for each deep-review specialist role; independent of ai_max_tokens. Default 4096.'
    required: false
    default: '4096'

  # #632: independent specialist corpus cap. A compact deterministic corpus is
  # built from the collected artifacts for the specialist roles only; this hard
  # UTF-8 byte cap is independent of the final review corpus budget.
  deep_review_corpus_max_bytes:
    description: 'Hard UTF-8 byte cap on the compact deep-review specialist corpus; independent of the final review corpus. Default 48000.'
    required: false
    default: '48000'

  enrichment_budget_sec:
    description: Maximum seconds to spend on enrichment (linked source fetching, release metadata, ghcr.io lookups). Exceeding the budget stops further enrichment. Default 60.
    required: false
    default: "60"
  image_digest_budget_sec:
    description: Maximum seconds to spend on image digest provenance lookups (registry tokens, manifests, revision compares). 0 disables the budget. Default 60.
    required: false
    default: "60"
  evidence_providers_file:
    description: Optional JSON file in the reviewed repository that defines evidence providers to run before review
    required: false
    default: ""
  sarif_files:
    description: Comma- or newline-delimited workspace-relative SARIF 2.1.0 files to include as evidence
    required: false
    default: ""
  sarif_max_findings:
    description: Global maximum number of findings combined across all supplied SARIF files
    required: false
    default: "200"
  evidence_provider_timeout_sec:
    description: Default timeout in seconds for each evidence provider command
    required: false
    default: "30"
  evidence_provider_max_output_bytes:
    description: Maximum stdout or stderr bytes captured per evidence provider command
    required: false
    default: "20000"
  evidence_provider_parallelism:
    description: Maximum evidence provider commands run concurrently. Set 1 to force serial execution when providers contend on shared files. Default 4.
    required: false
    default: "4"
  evidence_blocker_enforcement:
    description: If true, force request_changes when any evidence provider reports blocker severity
    required: false
    default: "false"
  evidence_enable_for_forks:
    description: If true, allow evidence providers to run on cross-repository pull requests
    required: false
    default: "false"
  tool_mode:
    description: >-
      Optional tool harness mode: "off" (no evidence tools) or "native_loop". With
      native_loop the model uses its native tool-calling API — it holds the tool
      schemas and decides each next read-only call from the previous result, enabling
      multi-hop evidence chains. A model that never emits a tool call degrades to a
      corpus-only review (the verdict is still produced). Loop turns stream by default
      (controlled by ai_stream) so long turns don't time out behind a short-idle proxy;
      a stream that can't be reassembled is retried non-streamed for that turn. Budgets:
      tool_max_requests, tool_max_rounds, and tool_loop_wall_clock_sec. (The legacy
      plan_execute_once / plan_execute_loop planner modes were removed in 2.0; a stale
      value is treated as "off".)
    required: false
    default: "off"
  tool_loop_wall_clock_sec:
    description: >-
      Wall-clock ceiling in seconds for the whole tool_mode=native_loop exchange
      (all model round-trips plus tool execution). Ignored for other modes.
    required: false
    default: "120"
  tool_loop_summarize:
    description: >-
      When "true", tool_mode=native_loop folds the oldest tool results into a
      model-generated evidence digest once the conversation outgrows its context
      budget, instead of blunt-truncating them — preserving salient facts
      (versions, paths, URLs, findings) in fewer tokens at the cost of one extra
      model call per compaction. Off by default (truncation). Ignored for other
      modes.
    required: false
    default: "false"
  tool_loop_summarize_max_tokens:
    description: >-
      Maximum completion tokens for each result-summarization call when
      tool_loop_summarize is enabled. Keep it small — the digest should be terse.
    required: false
    default: "512"
  tool_max_requests:
    description: >-
      Maximum number of tool requests the harness executes when tool_mode is
      enabled. Empty (the default) resolves a tier-aware budget from the review
      route (#701): ~8 for the primary route, ~16 for the smart route, and up
      to 20 for the escalated (deep) path — never above the hard ceiling of 20.
      An explicit value overrides every tier and is bounded to 1..20.
    required: false
    default: ""
  tool_max_rounds:
    description: >-
      Round budget for tool_mode=native_loop, where a round is a single model turn:
      the loop allows up to twice this value (capped at 8) to leave room for
      one-call-per-turn chains and repair turns. Ignored when tool_mode=off.
    required: false
    default: "3"
  tool_turn_timeout_sec:
    description: Timeout in seconds for each model turn of the tool_mode=native_loop exchange. Set generously for local models with slow prompt eval; native_loop streams turns by default (ai_stream) to avoid short-idle-proxy timeouts.
    required: false
    default: "60"
  tool_corpus_max_bytes:
    description: Maximum corpus bytes passed into the native_loop conversation's first turn
    required: false
    default: "50000"
  tool_max_tokens_per_turn:
    description: Maximum completion tokens for each model turn of the tool_mode=native_loop exchange
    required: false
    default: "400"
  tool_planning_timeout_sec:
    description: "DEPRECATED (removed in v3.0.0): use tool_turn_timeout_sec. Still honored as a fallback when tool_turn_timeout_sec is left at its default."
    required: false
    default: ""
  tool_planning_max_context_bytes:
    description: "DEPRECATED (removed in v3.0.0): use tool_corpus_max_bytes. Still honored as a fallback when tool_corpus_max_bytes is left at its default."
    required: false
    default: ""
  tool_planning_max_tokens:
    description: "DEPRECATED (removed in v3.0.0): use tool_max_tokens_per_turn. Still honored as a fallback when tool_max_tokens_per_turn is left at its default."
    required: false
    default: ""
  tool_max_response_bytes:
    description: Maximum bytes captured from each tool execution result
    required: false
    default: "12000"
  tool_allowed_gh_api_repos:
    description: Comma-separated owner/repo list allowed for gh_api tool requests; use * to allow any repo still permitted by the path allowlist (empty means current repo only)
    required: false
    default: ""
  tool_request_timeout_sec:
    description: Timeout in seconds for each tool request execution
    required: false
    default: "20"
  search_url:
    description: >-
      Search-engine endpoint (e.g. a SearXNG instance's /search URL) that
      enables the read-only web_search tool in the native tool loop. When set,
      the model can search for a page (release notes, a support/compatibility
      matrix) and then web_fetch the best result — useful when it doesn't know
      the exact URL. Empty (default) leaves web_search un-advertised. The model
      supplies only the query; the host is fixed by this setting. Subject to
      the same fork gating as the rest of the tool harness.
    required: false
    default: ""
  tool_max_search_results:
    description: Maximum results returned per web_search call
    required: false
    default: "5"
  tool_failure_enforcement:
    description: If true, force request_changes when tool harness planning fails
    required: false
    default: "false"
  tool_min_successful_requests:
    description: Minimum number of successful tool requests required when tool failure enforcement is enabled
    required: false
    default: "0"
  tool_enable_for_forks:
    description: If true, allow the tool harness to run on cross-repository pull requests
    required: false
    default: "false"
  tool_mcp_servers:
    description: >-
      Optional allowlist of read-only MCP servers for tool_mode=native_loop, as a
      newline/comma list of name=url (e.g. konflate=https://konflate.example/mcp).
      Their read-verb tools (list/get/read/…) are advertised as
      mcp__<name>__<tool> (double underscores); write-verb tools are refused.
      Empty = off (default).
      Fork-gated like the rest of the harness (tool_enable_for_forks). Only
      host-bearing http(s) URLs are accepted (HTTPS recommended); other schemes
      are dropped.
    required: false
    default: ""
  tool_mcp_token:
    description: Optional bearer token sent to every configured MCP server (tool_mcp_servers)
    required: false
    default: ""
  tool_mcp_name_prefixes:
    description: >-
      Comma-separated list of tool name prefixes to strip before the
      read-only verb check (e.g. toolhive workload prefixes from
      `prefixFormat: "{workload}_"`). Empty preserves the default-deny
      boundary.
    required: false
    default: ""
  ai_request_timeout_sec:
    description: Timeout in seconds for the primary model API request (curl --max-time)
    required: false
    default: "300"
  ai_connect_timeout_sec:
    description: Timeout in seconds for the primary model API connection (curl --connect-timeout)
    required: false
    default: "30"
  ai_fallback_request_timeout_sec:
    description: Timeout in seconds for the fallback model API request (curl --max-time). Defaults to ai_request_timeout_sec when blank.
    required: false
    default: ""
  ai_fallback_connect_timeout_sec:
    description: Timeout in seconds for the fallback model API connection (curl --connect-timeout). Defaults to ai_connect_timeout_sec when blank.
    required: false
    default: ""
  platform:
    description: >-
      Target hosting platform for API capability gating and backend selection.
      'auto' (default) detects from GITHUB_SERVER_URL and FORGEJO_API_URL:
      non-github.com hosts or FORGEJO_API_URL set resolves to 'forgejo';
      otherwise 'github'. Set 'forgejo' or 'github' explicitly to override
      auto-detection. On Forgejo, features requiring GitHub GraphQL
      (review minimization) degrade gracefully with a log line;
      the REST backend handles core PR operations. Linked-source enrichment
      always targets github.com regardless of this setting.
    required: false
    default: "auto"
  forgejo_api_url:
    description: >-
      Base URL for the Forgejo instance API backend (for example,
      https://forgejo.example.com). Optional on Forgejo Actions runners when
      GITHUB_SERVER_URL is set; set it when running from GitHub Actions or any
      runner that does not export the Forgejo server URL.
    required: false
    default: ""
  forgejo_token:
    description: >-
      Optional Forgejo API token. Defaults to github_token when blank. Use this
      when the token used for GitHub-compatible operations is not also valid for
      the Forgejo REST API.
    required: false
    default: ""
  forgejo_auth_method:
    description: >-
      Forgejo authentication method. 'token' (default) uses a static personal
      access token via the forgejo_token input. 'authorized_integration' uses
      Forgejo's authorized integrations flow: the action exchanges the
      forgejo_authorized_integration_audience for a short-lived JWT via the
      runner's OIDC token endpoint and authenticates API calls with
      'Authorization: Bearer {jwt}'. Requires forgejo_authorized_integration_audience
      and that the workflow sets 'enable-openid-connect: true'.
    required: false
    default: "token"
  forgejo_authorized_integration_audience:
    description: >-
      Audience identifier for the Forgejo Authorized Integration (the 'aud' JWT
      claim). Not secret — safe to commit to public code. Required when
      forgejo_auth_method is 'authorized_integration'. Ignored when
      forgejo_auth_method is 'token'.
    required: false
    default: ""
  forgejo_skip_permission_preflight:
    description: >-
      If true, allow the review to proceed when the Forgejo preflight reports
      an unrecognized ("unknown") permission — i.e. the server returned 200 but
      no recognizable permissions field. Distinct from granting write access:
      this only suppresses the unknown-payload error and logs a warning. Do
      not enable unless you have verified separately that the token can in fact
      publish reviews, otherwise the model output will be lost.
    required: false
    default: "false"
  skip_if_diff_unchanged:
    description: If true, skip the LLM review when the effective PR diff matches the last managed review comment fingerprint
    required: false
    default: "true"
  force_review:
    description: >-
      If true, bypass the diff-unchanged guard and run a full PR review, even
      when the fingerprint matches the last managed review. Set automatically
      when the rereview_label is added; callers can also pass it from a
      workflow_dispatch or repository_dispatch. Default false.
    required: false
    default: "false"
  rereview_label:
    description: >-
      Label that, when added to a PR, forces a fresh review even if nothing
      changed — the easy re-review trigger (only users with write/triage can
      label, so it is self-authorizing). On a `labeled` event the action
      reviews iff the added label matches this, then removes the label so
      re-adding re-triggers; any other label add is ignored. To enable, add
      `labeled` to the workflow's pull_request types. Default "ai-review".
    required: false
    default: "ai-review"
  comment_marker:
    description: HTML marker for the managed PR comment
    required: false
    default: "<!-- ai-pr-reviewer -->"
  ci_status_check:
    description: If true, wait for all CI checks to reach a terminal state before starting the AI review, then fold the per-check outcomes into the review corpus as evidence (so the model cites real test/lint results instead of "not verifiable"). Polls the Checks API for the PR head SHA. Default false — immediate review (original behavior).
    required: false
    default: "false"
  ci_timeout_sec:
    description: Maximum seconds to wait for CI checks to complete when ci_status_check=true. Default 300.
    required: false
    default: "300"
  ci_interval_sec:
    description: Seconds between CI status polls when ci_status_check=true. Default 15.
    required: false
    default: "15"
  ci_skip_on_timeout:
    description: If true, proceed with review after timeout instead of failing. If false, abort the action on timeout. Default true.
    required: false
    default: "true"
outputs:

  verdict:
    description: AI verdict, approve or request_changes
    value: ${{ steps.review.outputs.verdict || steps.precheck.outputs.verdict }}
  verdict_source:
    description: Where the final verdict came from ('model' or 'findings' per verdict_policy, or 'carry_forward' when an unchanged-diff skip retains the prior verdict)
    value: ${{ steps.review.outputs.verdict_source || steps.precheck.outputs.verdict_source }}
  required_checks:
    description: Required-check validation status ('complete', 'incomplete', or 'none' when validation did not run)
    value: ${{ steps.review.outputs.required_checks }}
  review_route:
    description: Model route used for this review ('legacy', 'primary', 'smart', or 'escalated')
    value: ${{ steps.review.outputs.review_route }}
  escalation_reason:
    description: "primary_requested when review_route is 'escalated' (the primary reviewer's structured smart_review_requested field triggered the smart re-review); empty otherwise"
    value: ${{ steps.review.outputs.escalation_reason }}
  findings:
    description: Normalized structured findings as a JSON array (empty array when the model produced none)
    value: ${{ steps.review.outputs.findings }}
  review_markdown:
    description: Human-readable markdown review body
    value: ${{ steps.review.outputs.review_markdown }}
  analysis_engine:
    description: Model and endpoint that produced the final result
    value: ${{ steps.review.outputs.analysis_engine }}
  should_review:
    description: Whether the action determined a new LLM review is needed
    value: ${{ steps.precheck.outputs.should_review }}
  skip_reason:
    description: Reason the LLM review was skipped
    value: ${{ steps.precheck.outputs.skip_reason }}
  diff_fingerprint:
    description: Stable fingerprint of the current pull request patch
    value: ${{ steps.precheck.outputs.diff_fingerprint }}
  ci_status_skipped:
    description: Whether CI status check was skipped (true) or completed (false)
    value: ${{ steps.review.outputs.ci_status_skipped }}
  ci_status_final:
    description: Final CI state (success/failure) when ci_status_check completed
    value: ${{ steps.review.outputs.ci_status_final }}
  cache_hit_ratio:
    description: Prompt-cache hit ratio for this review (0.0-1.0, from the tool harness in native_loop mode; empty when unavailable)
    value: ${{ steps.review.outputs.cache_hit_ratio }}
  tool_calls:
    description: JSON array of read-only tools executed by the native tool harness, with tool names and statuses
    value: ${{ steps.review.outputs.tool_calls }}

runs:
  using: composite
  steps:
    - name: Validate runtime dependencies
      shell: bash
      run: |
        set -euo pipefail
        command -v gh >/dev/null
        command -v jq >/dev/null
        command -v curl >/dev/null
        command -v git >/dev/null
        command -v python3 >/dev/null
        # Concurrent CI/deep-review gate cleanup walks the forked process tree
        # (scripts/sections/gating.sh); without pgrep the invariant cannot be
        # upheld, so it is validated here rather than silently weakened.
        command -v pgrep >/dev/null

    - name: Export shared review environment
      id: shared_env
      # Single source of truth for the env vars the precheck and the review
      # step consume with identical bindings (#641). The env block below
      # transports the input/github-context expressions; the run body
      # serializes them into a NUL-separated key/value file under $RUNNER_TEMP
      # (mktemp, umask 077) and publishes only the file path via a step
      # output. The precheck and the review step load that file explicitly
      # (scripts/load_shared_env.sh); $GITHUB_ENV is never used, so the
      # caller's job environment is never mutated and no shared value outlives
      # this composite action. Wiring rules:
      #   - an input both steps need: add it to the input definition plus this
      #     block only — nowhere else;
      #   - a single-step input goes in that step's own env block (still at
      #     most two edits);
      #   - PLATFORM / FORGEJO_API_URL stay per-step: the precheck binds the
      #     raw inputs to resolve them (#367); downstream steps consume the
      #     resolved steps.precheck.outputs instead;
      #   - review-only inputs (AI_MAX_TOKENS, VERDICT_POLICY, ...) stay in
      #     the review step's block: loading them in the precheck would widen
      #     its environment, whose AI_* sweep feeds the config fingerprint
      #     and would silently invalidate every stored review;
      #   - step-output-derived vars (IS_FORK_PR, PR_HEAD_SHA) stay in the
      #     step that consumes them.
      # The key list in the run body must match this env block 1:1 —
      # tests/test_shared_env_wiring.sh pins both directions and runs the
      # export and load paths end-to-end.
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        FORGEJO_TOKEN: ${{ inputs.forgejo_token || inputs.github_token }}
        FORGEJO_AUTH_METHOD: ${{ inputs.forgejo_auth_method }}
        FORGEJO_AUTHORIZED_INTEGRATION_AUDIENCE: ${{ inputs.forgejo_authorized_integration_audience }}
        FORGEJO_SKIP_PERMISSION_PREFLIGHT: ${{ inputs.forgejo_skip_permission_preflight }}
        REPO: ${{ inputs.repo || github.repository }}
        PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        AI_MODEL: ${{ inputs.ai_model }}
        AI_API_FORMAT: ${{ inputs.ai_api_format }}
        AI_TEMPERATURE: ${{ inputs.ai_temperature }}
        AI_RESPONSE_FORMAT: ${{ inputs.ai_response_format }}
        AI_TOKENS_PARAM: ${{ inputs.ai_tokens_param }}
        AI_FALLBACK_MODEL: ${{ inputs.ai_fallback_model }}
        REVIEW_ROUTING_MODE: ${{ inputs.review_routing_mode }}
        AI_PRIMARY_MODEL: ${{ inputs.ai_primary_model }}
        AI_SMART_MODEL: ${{ inputs.ai_smart_model }}
        ESCALATE_ON_RISK_FLAGS: ${{ inputs.escalate_on_risk_flags }}
        ESCALATE_ON_INCOMPLETE_REQUIRED_CHECKS: ${{ inputs.escalate_on_incomplete_required_checks }}
        ESCALATE_ON_FAST_REQUEST_CHANGES: ${{ inputs.escalate_on_fast_request_changes }}
        ESCALATE_ON_FAST_LOW_CONFIDENCE: ${{ inputs.escalate_on_fast_low_confidence }}
        ESCALATE_ON_TOOL_OR_EVIDENCE_BLOCKERS: ${{ inputs.escalate_on_tool_or_evidence_blockers }}
        ESCALATE_ON_TOOL_PLANNING_FAILURE: ${{ inputs.escalate_on_tool_planning_failure }}
        ANTHROPIC_VERSION: ${{ inputs.anthropic_version }}
        SYSTEM_PROMPT: ${{ inputs.system_prompt }}
        SYSTEM_PROMPT_FILE: ${{ inputs.system_prompt_file }}
        SYSTEM_PROMPT_MODE: ${{ inputs.system_prompt_mode }}
        REVIEW_VERBOSITY: ${{ inputs.review_verbosity }}
        STANDARDS_FILE: ${{ inputs.standards_file }}
        STANDARDS_FILE_CANDIDATES: ${{ inputs.standards_file_candidates }}
        CONTEXT_LIMIT_MODE: ${{ inputs.context_limit_mode }}
        MODEL_CONTEXT_TOKENS: ${{ inputs.model_context_tokens }}
        PRIMARY_MODEL_CONTEXT_TOKENS: ${{ inputs.primary_model_context_tokens }}
        SMART_MODEL_CONTEXT_TOKENS: ${{ inputs.smart_model_context_tokens }}
        PRIMARY_REQUEST_SHAPE: ${{ inputs.primary_request_shape }}
        SMART_REQUEST_SHAPE: ${{ inputs.smart_request_shape }}
        RELATED_CODE_CONTEXT: ${{ inputs.related_code_context }}
        RELATED_CODE_MAX_BYTES: ${{ inputs.related_code_max_bytes }}
        REPO_MAP_CONTEXT: ${{ inputs.repo_map_context }}
        REPO_MAP_MAX_BYTES: ${{ inputs.repo_map_max_bytes }}
        PR_THREAD_CONTEXT: ${{ inputs.pr_thread_context }}
        PR_THREAD_MAX_BYTES: ${{ inputs.pr_thread_max_bytes }}
        REVIEW_THREADS_CONTEXT: ${{ inputs.review_threads_context }}
        REVIEW_THREADS_MAX_BYTES: ${{ inputs.review_threads_max_bytes }}
        DEEP_REVIEW: ${{ inputs.deep_review }}
        DEEP_REVIEW_TIMEOUT_SEC: ${{ inputs.deep_review_timeout_sec }}
        DEEP_REVIEW_MAX_TOKENS: ${{ inputs.deep_review_max_tokens }}
        DEEP_REVIEW_CORPUS_MAX_BYTES: ${{ inputs.deep_review_corpus_max_bytes }}
        LINEAR_ISSUE_PREFIXES: ${{ inputs.linear_issue_prefixes }}
        LINEAR_ISSUE_TIMEOUT_SEC: ${{ inputs.linear_issue_timeout_sec }}
        LINEAR_ENABLE_FOR_FORKS: ${{ inputs.linear_enable_for_forks }}
        EVIDENCE_PROVIDERS_FILE: ${{ inputs.evidence_providers_file }}
        SARIF_FILES: ${{ inputs.sarif_files }}
        SARIF_MAX_FINDINGS: ${{ inputs.sarif_max_findings }}
        EVIDENCE_PROVIDER_TIMEOUT_SEC: ${{ inputs.evidence_provider_timeout_sec }}
        EVIDENCE_PROVIDER_MAX_OUTPUT_BYTES: ${{ inputs.evidence_provider_max_output_bytes }}
        EVIDENCE_BLOCKER_ENFORCEMENT: ${{ inputs.evidence_blocker_enforcement }}
        EVIDENCE_ENABLE_FOR_FORKS: ${{ inputs.evidence_enable_for_forks }}
        TOOL_MODE: ${{ inputs.tool_mode }}
        TOOL_MCP_SERVERS: ${{ inputs.tool_mcp_servers }}
        TOOL_MCP_TOKEN: ${{ inputs.tool_mcp_token }}
        TOOL_MCP_NAME_PREFIXES: ${{ inputs.tool_mcp_name_prefixes }}
        TOOL_LOOP_WALL_CLOCK_SEC: ${{ inputs.tool_loop_wall_clock_sec }}
        TOOL_LOOP_SUMMARIZE: ${{ inputs.tool_loop_summarize }}
        TOOL_LOOP_SUMMARIZE_MAX_TOKENS: ${{ inputs.tool_loop_summarize_max_tokens }}
        TOOL_MAX_REQUESTS: ${{ inputs.tool_max_requests }}
        TOOL_MAX_ROUNDS: ${{ inputs.tool_max_rounds }}
        # #540: new names take precedence; the deprecated tool_planning_* inputs
        # still work as a fallback for one release (removed in v3.0.0).
        TOOL_TURN_TIMEOUT_SEC: ${{ inputs.tool_turn_timeout_sec != '' && inputs.tool_turn_timeout_sec || inputs.tool_planning_timeout_sec }}
        TOOL_CORPUS_MAX_BYTES: ${{ inputs.tool_corpus_max_bytes != '' && inputs.tool_corpus_max_bytes || inputs.tool_planning_max_context_bytes }}
        TOOL_MAX_TOKENS_PER_TURN: ${{ inputs.tool_max_tokens_per_turn != '' && inputs.tool_max_tokens_per_turn || inputs.tool_planning_max_tokens }}
        TOOL_MAX_RESPONSE_BYTES: ${{ inputs.tool_max_response_bytes }}
        TOOL_ALLOWED_GH_API_REPOS: ${{ inputs.tool_allowed_gh_api_repos }}
        TOOL_REQUEST_TIMEOUT_SEC: ${{ inputs.tool_request_timeout_sec }}
        SEARCH_URL: ${{ inputs.search_url }}
        TOOL_MAX_SEARCH_RESULTS: ${{ inputs.tool_max_search_results }}
        TOOL_FAILURE_ENFORCEMENT: ${{ inputs.tool_failure_enforcement }}
        TOOL_MIN_SUCCESSFUL_REQUESTS: ${{ inputs.tool_min_successful_requests }}
        TOOL_ENABLE_FOR_FORKS: ${{ inputs.tool_enable_for_forks }}
        AI_REQUEST_TIMEOUT_SEC: ${{ inputs.ai_request_timeout_sec }}
        AI_CONNECT_TIMEOUT_SEC: ${{ inputs.ai_connect_timeout_sec }}
        AI_FALLBACK_REQUEST_TIMEOUT_SEC: ${{ inputs.ai_fallback_request_timeout_sec }}
        AI_FALLBACK_CONNECT_TIMEOUT_SEC: ${{ inputs.ai_fallback_connect_timeout_sec }}
      run: |
        set -euo pipefail
        if [ -z "${GITHUB_OUTPUT:-}" ]; then
          echo "::error::GITHUB_OUTPUT is not set; cannot publish the shared environment path." >&2
          exit 1
        fi
        # The file carries tokens (GH_TOKEN, FORGEJO_TOKEN, ...): umask 077 +
        # mktemp keep it owner-only, outside the reviewed workspace. The
        # runner cleans $RUNNER_TEMP up after the job, but the file must not
        # outlive this action even then: the EXIT trap below removes it if
        # serialization fails before the path is published, and the
        # 'Clean up shared environment' step removes it after the last
        # consumer runs.
        umask 077
        shared_env_file="$(mktemp "${RUNNER_TEMP:-/tmp}/shared-env.XXXXXXXX")"
        trap 'rm -f -- "$shared_env_file"' EXIT
        # Keep in lockstep with the env block above (pinned by
        # tests/test_shared_env_wiring.sh).
        keys=(
          GH_TOKEN
          FORGEJO_TOKEN
          FORGEJO_AUTH_METHOD
          FORGEJO_AUTHORIZED_INTEGRATION_AUDIENCE
          FORGEJO_SKIP_PERMISSION_PREFLIGHT
          REPO
          PR_NUMBER
          AI_MODEL
          AI_API_FORMAT
          AI_TEMPERATURE
          AI_RESPONSE_FORMAT
          AI_TOKENS_PARAM
          AI_FALLBACK_MODEL
          REVIEW_ROUTING_MODE
          AI_PRIMARY_MODEL
          AI_SMART_MODEL
          ESCALATE_ON_RISK_FLAGS
          ESCALATE_ON_INCOMPLETE_REQUIRED_CHECKS
          ESCALATE_ON_FAST_REQUEST_CHANGES
          ESCALATE_ON_FAST_LOW_CONFIDENCE
          ESCALATE_ON_TOOL_OR_EVIDENCE_BLOCKERS
          ESCALATE_ON_TOOL_PLANNING_FAILURE
          ANTHROPIC_VERSION
          SYSTEM_PROMPT
          SYSTEM_PROMPT_FILE
          SYSTEM_PROMPT_MODE
          REVIEW_VERBOSITY
          STANDARDS_FILE
          STANDARDS_FILE_CANDIDATES
          CONTEXT_LIMIT_MODE
          MODEL_CONTEXT_TOKENS
          PRIMARY_MODEL_CONTEXT_TOKENS
          SMART_MODEL_CONTEXT_TOKENS
          PRIMARY_REQUEST_SHAPE
          SMART_REQUEST_SHAPE
          RELATED_CODE_CONTEXT
          RELATED_CODE_MAX_BYTES
          REPO_MAP_CONTEXT
          REPO_MAP_MAX_BYTES
          PR_THREAD_CONTEXT
          PR_THREAD_MAX_BYTES
          REVIEW_THREADS_CONTEXT
          REVIEW_THREADS_MAX_BYTES
          DEEP_REVIEW
          DEEP_REVIEW_TIMEOUT_SEC
          DEEP_REVIEW_MAX_TOKENS
          DEEP_REVIEW_CORPUS_MAX_BYTES
          LINEAR_ISSUE_PREFIXES
          LINEAR_ISSUE_TIMEOUT_SEC
          LINEAR_ENABLE_FOR_FORKS
          EVIDENCE_PROVIDERS_FILE
          SARIF_FILES
          SARIF_MAX_FINDINGS
          EVIDENCE_PROVIDER_TIMEOUT_SEC
          EVIDENCE_PROVIDER_MAX_OUTPUT_BYTES
          EVIDENCE_BLOCKER_ENFORCEMENT
          EVIDENCE_ENABLE_FOR_FORKS
          TOOL_MODE
          TOOL_MCP_SERVERS
          TOOL_MCP_TOKEN
          TOOL_MCP_NAME_PREFIXES
          TOOL_LOOP_WALL_CLOCK_SEC
          TOOL_LOOP_SUMMARIZE
          TOOL_LOOP_SUMMARIZE_MAX_TOKENS
          TOOL_MAX_REQUESTS
          TOOL_MAX_ROUNDS
          TOOL_TURN_TIMEOUT_SEC
          TOOL_CORPUS_MAX_BYTES
          TOOL_MAX_TOKENS_PER_TURN
          TOOL_MAX_RESPONSE_BYTES
          TOOL_ALLOWED_GH_API_REPOS
          TOOL_REQUEST_TIMEOUT_SEC
          SEARCH_URL
          TOOL_MAX_SEARCH_RESULTS
          TOOL_FAILURE_ENFORCEMENT
          TOOL_MIN_SUCCESSFUL_REQUESTS
          TOOL_ENABLE_FOR_FORKS
          AI_REQUEST_TIMEOUT_SEC
          AI_CONNECT_TIMEOUT_SEC
          AI_FALLBACK_REQUEST_TIMEOUT_SEC
          AI_FALLBACK_CONNECT_TIMEOUT_SEC
        )
        # The delimiter-free NUL framing cannot be forged by a value: NUL
        # cannot appear in an environment value, so every value (multiline,
        # empty, quotes, '=') round-trips byte-for-byte. Nothing is echoed to
        # the step log.
        {
          for key in "${keys[@]}"; do
            if [ -z "${!key+x}" ]; then
              echo "::error::Shared env var '${key}' is listed in the export key list but not bound in the 'Export shared review environment' env block." >&2
              exit 1
            fi
            printf '%s\0%s\0' "$key" "${!key}"
          done
        } > "$shared_env_file"
        # Only the path crosses the step boundary — never a value. Once the
        # path is published the consumers own the lifecycle; drop the EXIT
        # trap so the success path does NOT delete the file out from under
        # them (the 'Clean up shared environment' step deletes it later).
        echo "path=$shared_env_file" >> "$GITHUB_OUTPUT"
        trap - EXIT

    - name: Check whether review is needed
      id: precheck
      shell: bash
      env:
        # Shared input/github-context bindings are serialized once by the
        # 'Export shared review environment' step into an action-local file
        # under $RUNNER_TEMP and loaded below (#641) — the caller's job
        # environment is never touched. Only the precheck-specific bindings
        # remain here: the raw PLATFORM / FORGEJO_API_URL inputs this step
        # resolves (#367) and the precheck-only pass-throughs.
        SHARED_ENV_FILE: ${{ steps.shared_env.outputs.path }}
        PLATFORM: ${{ inputs.platform }}
        FORGEJO_API_URL: ${{ inputs.forgejo_api_url || (github.server_url != 'https://github.com' && github.server_url) || '' }}
        EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        COMMENT_MARKER: ${{ inputs.comment_marker }}
        PUBLISH_MODE: ${{ inputs.publish_mode }}
        SKIP_IF_DIFF_UNCHANGED: ${{ inputs.skip_if_diff_unchanged }}
        FORCE_REVIEW: ${{ inputs.force_review }}
        REREVIEW_LABEL: ${{ inputs.rereview_label }}
        ACTION_REF: ${{ github.action_ref }}
        LINEAR_API_KEY_CONFIGURED: ${{ inputs.linear_api_key != '' }}
        # #633: with deep_review=auto, the precheck's stale-review detection
        # hashes the same Linear state (priority/labels of configured
        # identifiers) the review pipeline's Linear phase fetches, so a
        # Linear priority/label change invalidates a stale managed comment.
        # The key is bound HERE ONLY — it stays out of the shared env file
        # and out of the config fingerprint (the *_API_KEY suffix is
        # excluded); the builder uses it solely for the read-only issue
        # lookup, and fork PRs never query Linear unless
        # linear_enable_for_forks is set (the pipeline's own gate).
        LINEAR_API_KEY: ${{ inputs.linear_api_key }}
      run: |
        set -euo pipefail
        # Load the shared bindings (REPO, PR_NUMBER, AI_MODEL, TOOL_* , ...)
        # from the action-local file before the precheck runs.
        source "${{ github.action_path }}/scripts/load_shared_env.sh"
        load_shared_env "$SHARED_ENV_FILE"
        bash "${{ github.action_path }}/scripts/check_review_needed.sh"

    - name: Run AI review
      if: steps.precheck.outputs.should_review == 'true'
      id: review
      shell: bash
      env:
        # Shared input/github-context bindings arrive from the action-local
        # file built by 'Export shared review environment' and are loaded in
        # the run body below (#641). What remains: the resolved-platform
        # overrides (#367), review-only inputs (kept out of the shared file so
        # the precheck's AI_* config-fingerprint sweep sees an unchanged
        # environment), and the step-output-derived vars this step consumes.
        SHARED_ENV_FILE: ${{ steps.shared_env.outputs.path }}
        PLATFORM: ${{ steps.precheck.outputs.resolved_platform }}
        FORGEJO_API_URL: ${{ steps.precheck.outputs.effective_forgejo_api_url }}
        AI_BASE_URL: ${{ inputs.ai_base_url }}
        AI_API_KEY: ${{ inputs.ai_api_key }}
        AI_MAX_TOKENS: ${{ inputs.ai_max_tokens }}
        AI_FALLBACK_BASE_URL: ${{ inputs.ai_fallback_base_url || inputs.ai_base_url }}
        AI_FALLBACK_API_FORMAT: ${{ inputs.ai_fallback_api_format || inputs.ai_api_format }}
        AI_FALLBACK_API_KEY: ${{ inputs.ai_fallback_api_key || inputs.ai_api_key }}
        AI_PRIMARY_RETRIES: ${{ inputs.ai_primary_retries }}
        AI_PRIMARY_RETRY_DELAY_SEC: ${{ inputs.ai_primary_retry_delay_sec }}
        ON_MODEL_FAILURE: ${{ inputs.on_model_failure }}
        VERDICT_POLICY: ${{ inputs.verdict_policy }}
        VALIDATE_REQUIRED_CHECKS: ${{ inputs.validate_required_checks }}
        REQUIRED_CHECK_VALIDATION_MODE: ${{ inputs.required_check_validation_mode }}
        AI_PRIMARY_BASE_URL: ${{ inputs.ai_primary_base_url }}
        AI_PRIMARY_API_FORMAT: ${{ inputs.ai_primary_api_format }}
        AI_PRIMARY_API_KEY: ${{ inputs.ai_primary_api_key }}
        AI_SMART_BASE_URL: ${{ inputs.ai_smart_base_url }}
        AI_SMART_API_FORMAT: ${{ inputs.ai_smart_api_format }}
        AI_SMART_API_KEY: ${{ inputs.ai_smart_api_key }}
        AI_STREAM: ${{ inputs.ai_stream }}
        AI_FALLBACK_STREAM: ${{ inputs.ai_fallback_stream }}
        ALLOWED_SOURCE_HOSTS: ${{ inputs.allowed_source_hosts }}
        LINEAR_API_KEY: ${{ inputs.linear_api_key }}
        ENRICHMENT_BUDGET_SEC: ${{ inputs.enrichment_budget_sec }}
        IMAGE_DIGEST_BUDGET_SEC: ${{ inputs.image_digest_budget_sec }}
        EVIDENCE_PROVIDER_PARALLELISM: ${{ inputs.evidence_provider_parallelism }}
        # #634: CI gating moved into the review pipeline so it forks
        # concurrently with the advisory specialist phase (scripts/sections/
        # gating.sh). wait_for_ci.sh writes ci_status_final / ci_status_skipped
        # to this step's $GITHUB_OUTPUT, so the action outputs below source
        # them from steps.review. The historical continue-on-error semantics
        # are preserved inside the pipeline: a CI timeout/failure never blocks
        # the review.
        CI_STATUS_CHECK: ${{ inputs.ci_status_check }}
        CI_TIMEOUT_SEC: ${{ inputs.ci_timeout_sec }}
        CI_INTERVAL_SEC: ${{ inputs.ci_interval_sec }}
        CI_SKIP_ON_TIMEOUT: ${{ inputs.ci_skip_on_timeout }}
        CI_CHECKS_FILE: ${{ runner.temp }}/ci-checks-context.md
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || steps.precheck.outputs.head_sha }}
        IS_FORK_PR: ${{ steps.precheck.outputs.is_fork_pr }}
      run: |
        set -euo pipefail
        # Load the shared bindings (GH_TOKEN, REPO, AI_MODEL, TOOL_* , ...)
        # from the action-local file before the review runs.
        source "${{ github.action_path }}/scripts/load_shared_env.sh"
        load_shared_env "$SHARED_ENV_FILE"
        bash "${{ github.action_path }}/scripts/run_review.sh"

    - name: Clean up shared environment
      # Action-scoped lifecycle for the shared env file (#641): it carries
      # tokens (GH_TOKEN, FORGEJO_TOKEN, TOOL_MCP_TOKEN, ...), so it must not
      # outlive the composite action — not when should_review is false and
      # this step is the only consumer left, not when the review failed, and
      # not when an earlier internal step failed after the file was created.
      # if: always() guarantees the deletion runs on every one of those paths;
      # the body is fail-soft so a cleanup problem can never replace the real
      # action result. The step receives only the file path, never a value.
      if: always()
      shell: bash
      env:
        SHARED_ENV_FILE: ${{ steps.shared_env.outputs.path }}
      run: |
        if [ -n "${SHARED_ENV_FILE:-}" ]; then
          rm -f -- "$SHARED_ENV_FILE" 2>/dev/null || true
        fi
        exit 0

    - name: Publish review
      # Single dispatcher for all three publish modes. One superset env block
      # (harmless unused keys per mode) replaces the three near-duplicate
      # blocks that drifted apart and broke v1.2.10 (#255, #303): a single
      # block makes a duplicate-key manifest error structurally impossible.
      # All per-mode inline `${{ }}` expressions are hoisted into env so the
      # run body is pure bash dispatching on $PUBLISH_MODE.
      if: steps.precheck.outputs.should_review == 'true' && (inputs.publish_mode == 'review_comment' || inputs.publish_mode == 'review_verdict' || (inputs.publish_mode == 'comment' && inputs.publish_review_comment == 'true'))
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        PLATFORM: ${{ steps.precheck.outputs.resolved_platform }}
        FORGEJO_API_URL: ${{ steps.precheck.outputs.effective_forgejo_api_url }}
        FORGEJO_TOKEN: ${{ inputs.forgejo_token || inputs.github_token }}
        FORGEJO_AUTH_METHOD: ${{ inputs.forgejo_auth_method }}
        FORGEJO_AUTHORIZED_INTEGRATION_AUDIENCE: ${{ inputs.forgejo_authorized_integration_audience }}
        FORGEJO_SKIP_PERMISSION_PREFLIGHT: ${{ inputs.forgejo_skip_permission_preflight }}
        REPO: ${{ inputs.repo || github.repository }}
        PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || steps.precheck.outputs.head_sha }}
        BROAD_FINGERPRINT: ${{ steps.precheck.outputs.diff_fingerprint }}
        VERDICT: ${{ steps.review.outputs.verdict }}
        REQUIRED_CHECKS: ${{ steps.review.outputs.required_checks }}
        REVIEW_ROUTE: ${{ steps.review.outputs.review_route }}
        ESCALATION_REASON: ${{ steps.review.outputs.escalation_reason }}
        REVIEW_MARKDOWN: ${{ steps.review.outputs.review_markdown }}
        FINDINGS: ${{ steps.review.outputs.findings }}
        ANALYSIS_ENGINE: ${{ steps.review.outputs.analysis_engine }}
        CACHE_HIT_RATIO: ${{ steps.review.outputs.cache_hit_ratio }}
        COMMENT_MARKER: ${{ inputs.comment_marker }}
        INLINE_FINDINGS: ${{ inputs.inline_findings }}
        INLINE_FINDINGS_MAX: ${{ inputs.inline_findings_max }}
        CLEANUP_PREVIOUS_NATIVE_REVIEWS: ${{ inputs.cleanup_previous_native_reviews }}
        UPSTREAM_LINK_MODE: ${{ inputs.upstream_link_mode }}
        ALLOW_APPROVE: ${{ inputs.allow_approve }}
        APPROVE_FORKS: ${{ inputs.approve_forks }}
        PUBLISH_MODE: ${{ inputs.publish_mode }}
        BASE_SHA: ${{ github.event.pull_request.base.sha || steps.precheck.outputs.base_sha }}
        IS_FORK_PR: ${{ steps.precheck.outputs.is_fork_pr }}
        GITHUB_ACTION_PATH: ${{ github.action_path }}
      run: bash "${{ github.action_path }}/scripts/publish.sh"

    - name: Clear re-review label
      # When a label add triggered this review, remove it so re-adding the
      # label re-triggers. Best-effort; never fails the run.
      if: ${{ github.event.action == 'labeled' && github.event.label.name == inputs.rereview_label && steps.precheck.outputs.should_review == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        PLATFORM: ${{ steps.precheck.outputs.resolved_platform }}
        FORGEJO_API_URL: ${{ steps.precheck.outputs.effective_forgejo_api_url }}
        FORGEJO_TOKEN: ${{ inputs.forgejo_token || inputs.github_token }}
        FORGEJO_AUTH_METHOD: ${{ inputs.forgejo_auth_method }}
        FORGEJO_AUTHORIZED_INTEGRATION_AUDIENCE: ${{ inputs.forgejo_authorized_integration_audience }}
        FORGEJO_SKIP_PERMISSION_PREFLIGHT: ${{ inputs.forgejo_skip_permission_preflight }}
        REPO: ${{ inputs.repo || github.repository }}
        PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        LABEL: ${{ inputs.rereview_label }}
      run: gh api -X DELETE "repos/${REPO}/issues/${PR_NUMBER}/labels/${LABEL}" --silent 2>/dev/null || true

    - name: Fail on request_changes
      # Gate the merge on the final verdict. Runs after publishing, so the
      # review comment and inline findings have already landed on the PR.
      # Reads the same value the `verdict` output reports (post-verdict_policy,
      # post-evidence-blocker and tool-failure enforcement) from the step
      # output context — the same expression the top-level `verdict` output
      # uses, so the carry-forward / diff-unchanged paths that flow through
      # steps.precheck.outputs.verdict are gated too. It must NOT read
      # $GITHUB_OUTPUT: in composite actions that is a per-step file reset
      # between steps, so a grep there always returns empty and the gate is a
      # no-op (#557). A model outage (on_model_failure=notice) writes no
      # request_changes verdict, so it does not wedge merges.
      if: ${{ inputs.fail_on_request_changes == 'true' }}
      shell: bash
      env:
        FINAL_VERDICT: ${{ steps.review.outputs.verdict || steps.precheck.outputs.verdict }}
      run: |
        if [ "$FINAL_VERDICT" = "request_changes" ]; then
          echo "::error::Final verdict is request_changes; failing the step (fail_on_request_changes=true)."
          exit 1
        fi
        echo "Final verdict is '${FINAL_VERDICT:-<none>}'; not blocking (fail_on_request_changes=true)."
