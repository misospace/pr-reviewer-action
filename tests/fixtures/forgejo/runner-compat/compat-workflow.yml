name: v3 forgejo runner compat
on: push
jobs:
  compat:
    runs-on: node24
    steps:
      - name: checkout
        run: |
          set -eu
          git config --global --add safe.directory '*'
          git clone --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" .
          git checkout "$GITHUB_SHA"
          test -f v3/composite/action.yml
      - name: node launcher preflight
        run: |
          set -eu
          if ! node_bin="$(command -v node)"; then
            echo "node is not on PATH; the v3 composite wrapper requires it" >&2
            exit 1
          fi
          v="$(node --version)"
          major="${v#v}"; major="${major%%.*}"
          case "$major" in
            ''|*[!0-9]*) major=0 ;;
          esac
          # #672 sets the v3 bundled CLI baseline to Node 24 LTS; the launcher
          # preflight must refuse older interpreters, not merely warn.
          if [ "$major" -lt 24 ]; then
            echo "node >= 24 required, found $v at $node_bin" >&2
            exit 1
          fi
          echo "launcher preflight ok: $node_bin $v"
      - id: composite
        uses: ./v3/composite
        with:
          test-kebab-input: kebab-value
          token: ${{ secrets.GITHUB_TOKEN }}
          platform: forgejo
      - name: outputs and summary
        env:
          COMPOSITE: ${{ steps.composite.outputs.test-kebab-output }}
        run: |
          test "$COMPOSITE" = composite-passed
          test -n "$GITHUB_STEP_SUMMARY"
          echo "compat-output=$COMPOSITE"
          # The composite fixture already appended to and read back
          # GITHUB_STEP_SUMMARY within its own step (same-step summary
          # behavior). Mark this step's contribution for the next step.
          echo 'compat-summary-canary-683' >> "$GITHUB_STEP_SUMMARY"
      - name: step summary is reset per step
        run: |
          # Recorded Forgejo difference: act_runner resets GITHUB_STEP_SUMMARY
          # between steps (GitHub accumulates job-wide), so this step's fresh
          # summary file must not contain the previous step's canary. If a
          # runner ever starts accumulating, this assertion fails loudly and
          # the ADR claim must be revisited.
          test -f "$GITHUB_STEP_SUMMARY"
          if grep -q 'compat-summary-canary-683' "$GITHUB_STEP_SUMMARY"; then
            echo "GITHUB_STEP_SUMMARY carried prior-step content; update the recorded Forgejo difference" >&2
            exit 1
          fi
      - name: deliberate failure and finalization
        id: failure
        continue-on-error: true
        uses: ./v3/composite
        with:
          test-kebab-input: kebab-value
          token: ${{ secrets.GITHUB_TOKEN }}
          platform: forgejo
          fail: 'true'
      - name: failure reported and finalized
        if: always()
        env:
          OUTCOME: ${{ steps.failure.outcome }}
        run: |
          test "$OUTCOME" = failure
          test -f "$RUNNER_TEMP/v3-composite-success-finalized"
          test -f "$RUNNER_TEMP/v3-composite-failure-finalized"
