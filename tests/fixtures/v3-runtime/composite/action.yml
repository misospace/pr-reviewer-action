name: v3 composite runtime spike
description: Isolated runner probe
inputs:
  test-kebab-input:
    description: input probe
    required: true
  token:
    description: API token
    required: true
  fail:
    description: trigger finalizer failure
    default: 'false'
  platform:
    description: REST platform flavor used by the probe API request
    default: github
outputs:
  test-kebab-output:
    description: output probe
    value: ${{ steps.probe.outputs.test-kebab-output }}
runs:
  using: composite
  steps:
    - id: probe
      shell: bash
      env:
        SPIKE_INPUT: ${{ inputs.test-kebab-input }}
        SPIKE_TOKEN: ${{ inputs.token }}
        SPIKE_FAIL: ${{ inputs.fail }}
        SPIKE_PLATFORM: ${{ inputs.platform }}
        GITHUB_ACTION_PATH: ${{ github.action_path }}
      run: node "$GITHUB_ACTION_PATH/../cli-entry.mjs"
